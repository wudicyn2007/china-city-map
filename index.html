<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>中国地级市点亮地图</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #ffffff; padding: 20px; }
        #map { width: 100%; height: auto; }
        .city {
            fill: #ffffff;
            stroke: #333;
            stroke-width: 0.4;
            cursor: pointer;
        }
        .city.active {
            fill: #009944; /* 绿色点亮，和你示范的效果一致 */
        }
        .province {
            fill: none;
            stroke: #000;
            stroke-width: 1.2;
            pointer-events: none;
        }
        #tip {
            position: absolute;
            background: #222;
            color: #fff;
            padding: 4px 8px;
            font-size: 12px;
            border-radius: 4px;
            display: none;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <svg id="map" viewBox="0 0 1000 800" width="100%" height="auto"></svg>
    <div id="tip"></div>

    <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
    <script>
        // ========== 在这里添加你要点亮的城市 ==========
        const LIGHT_CITIES = new Set([
            "北京市", "上海市", "广州市", "深圳市",
            "成都市", "杭州市", "武汉市", "西安市", "重庆市"
        ]);

        const svg = d3.select("#map");
        const tip = d3.select("#tip");

        // 地图投影配置，适配全国范围
        const projection = d3.geoMercator()
            .center([104, 36])
            .scale(900)
            .translate([500, 400]);

        const path = d3.geoPath().projection(projection);

        // ========== 适配你修改后的文件名 ==========
        d3.json("city.geojson").then(cityData => {
            svg.selectAll(".city")
               .data(cityData.features)
               .enter()
               .append("path")
               .attr("class", d => `city ${LIGHT_CITIES.has(d.properties.name) ? "active" : ""}`)
               .attr("d", path)
               .on("mouseover", (e, d) => {
                   tip.text(d.properties.name).style("display", "block");
               })
               .on("mousemove", e => {
                   tip.style("left", (e.pageX + 10) + "px")
                      .style("top", (e.pageY + 10) + "px");
               })
               .on("mouseout", () => {
                   tip.style("display", "none");
               });

            // 加载省界数据
            d3.json("province.geojson").then(provData => {
                svg.selectAll(".province")
                   .data(provData.features)
                   .enter()
                   .append("path")
                   .attr("class", "province")
                   .attr("d", path);
            });
        });
    </script>
</body>
</html>
