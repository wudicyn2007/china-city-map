<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>中国地级市点亮地图</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #ffffff;
            padding: 20px;
            font-family: system-ui, -apple-system, sans-serif;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        #map {
            width: 100%;
            height: auto;
            background: #ffffff;
        }
        /* 地级市样式 */
        .city {
            fill: #ffffff;
            stroke: #333333;
            stroke-width: 0.3;
            cursor: pointer;
            transition: fill 0.2s ease;
        }
        /* 点亮样式（和你示范的绿色一致） */
        .city.light {
            fill: #00882b;
        }
        /* 省级边界加粗 */
        .province-boundary {
            fill: none;
            stroke: #000000;
            stroke-width: 0.8;
            pointer-events: none;
        }
        /* 悬浮提示 */
        #tooltip {
            position: absolute;
            background: rgba(0, 0, 0, 0.8);
            color: #ffffff;
            padding: 4px 8px;
            border-radius: 3px;
            font-size: 12px;
            pointer-events: none;
            display: none;
            z-index: 100;
        }
    </style>
    <!-- 引入地图渲染核心库，轻量稳定 -->
    <script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
</head>
<body>
    <div class="container">
        <svg id="map" viewBox="0 0 1000 800"></svg>
        <div id="tooltip"></div>
    </div>

    <script>
        // ==================================================
        // 【你只需要改这里！】控制城市点亮状态
        // 格式："城市全称": true （点亮）/ false（不点亮）
        // ==================================================
        const LIGHT_CITIES = {
            "北京市": true,
            "上海市": true,
            "广州市": true,
            "深圳市": true,
            "成都市": true,
            "杭州市": true,
            "武汉市": true,
            "西安市": true,
            "重庆市": true,
            // 你要点亮哪个城市，直接加一行就行
        };

        // 地图核心配置
        const svg = d3.select("#map");
        const width = 1000;
        const height = 800;
        const tooltip = document.getElementById("tooltip");

        // 中国地图专用投影（完美适配全国范围，包括南海诸岛）
        const projection = d3.geoMercator()
            .center([104, 38])
            .scale(850)
            .translate([width / 2, height / 2]);

        const pathGenerator = d3.geoPath().projection(projection);

        // 加载全国地级市完整边界数据（阿里云官方公开稳定数据源，无跨域）
        d3.json("https://geo.datav.aliyun.com/areas_v3/bound/100000_full.json").then(geoData => {
            // 1. 渲染所有地级市
            svg.selectAll(".city")
                .data(geoData.features)
                .enter()
                .append("path")
                .attr("class", d => `city ${LIGHT_CITIES[d.properties.name] ? "light" : ""}`)
                .attr("d", pathGenerator)
                .attr("data-name", d => d.properties.name)
                // 鼠标悬浮事件
                .on("mouseenter", (event, d) => {
                    tooltip.textContent = d.properties.name;
                    tooltip.style.display = "block";
                })
                .on("mousemove", (event) => {
                    tooltip.style.left = event.pageX + 10 + "px";
                    tooltip.style.top = event.pageY + 10 + "px";
                })
                .on("mouseleave", () => {
                    tooltip.style.display = "none";
                });

            // 2. 渲染省级边界（加粗，和示范图一致）
            d3.json("https://geo.datav.aliyun.com/areas_v3/bound/100000.json").then(provinceData => {
                svg.selectAll(".province-boundary")
                    .data(provinceData.features)
                    .enter()
                    .append("path")
                    .attr("class", "province-boundary")
                    .attr("d", pathGenerator);
            });
        });
    </script>
</body>
</html>
