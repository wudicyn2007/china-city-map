<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>中国地级市点亮地图（精准边界版）</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #fff; padding: 20px; font-family: system-ui, sans-serif; }
        .container { max-width: 1200px; margin: 0 auto; }
        #map { width: 100%; height: auto; background: #fff; }
        /* 地级市样式 */
        .city {
            fill: #ffffff;
            stroke: #333;
            stroke-width: 0.4;
            cursor: pointer;
            transition: fill 0.2s;
        }
        /* 点亮色（和你示范绿色一致） */
        .city.active { fill: #00882b; }
        /* 省界加粗 */
        .province {
            fill: none;
            stroke: #000;
            stroke-width: 1;
            pointer-events: none;
        }
        /* 悬浮提示 */
        #tooltip {
            position: absolute;
            background: rgba(0,0,0,0.8);
            color: #fff;
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 12px;
            pointer-events: none;
            display: none;
            z-index: 999;
        }
    </style>
    <!-- D3.js（CDN，稳定无跨域） -->
    <script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
</head>
<body>
    <div class="container">
        <svg id="map" viewBox="0 0 1000 800"></svg>
        <div id="tooltip"></div>
    </div>

    <script>
        // ========== 点亮控制：在这里填城市名即可点亮 ==========
        const LIGHT_CITIES = new Set([
            "北京市", "上海市", "广州市", "深圳市",
            "成都市", "杭州市", "武汉市", "西安市", "重庆市"
        ]);

        // 地图基础配置
        const svg = d3.select("#map");
        const width = 1000, height = 800;
        const tooltip = d3.select("#tooltip");

        // 中国地图投影（适配全国，含南海诸岛）
        const projection = d3.geoMercator()
            .center([104, 38])
            .scale(850)
            .translate([width/2, height/2]);

        const path = d3.geoPath().projection(projection);

        // 1. 加载地级市边界（精准曲线，含省直辖县）
        d3.json("https://geo.datav.aliyun.com/areas_v3/bound/100000_full.json")
        .then(cityData => {
            // 渲染所有地级市
            svg.selectAll("path.city")
                .data(cityData.features)
                .enter()
                .append("path")
                .attr("class", d => `city ${LIGHT_CITIES.has(d.properties.name) ? "active" : ""}`)
                .attr("d", path)
                .attr("data-name", d => d.properties.name)
                // 悬浮事件
                .on("mouseover", (e, d) => {
                    tooltip.style("display", "block").text(d.properties.name);
                })
                .on("mousemove", (e) => {
                    tooltip.style("left", `${e.pageX+10}px`).style("top", `${e.pageY+10}px`);
                })
                .on("mouseout", () => tooltip.style("display", "none"));

            // 2. 加载省界（加粗，分层显示）
            d3.json("https://geo.datav.aliyun.com/areas_v3/bound/100000.json")
            .then(provinceData => {
                svg.selectAll("path.province")
                    .data(provinceData.features)
                    .enter()
                    .append("path")
                    .attr("class", "province")
                    .attr("d", path);
            });
        })
        .catch(err => console.error("地图加载失败：", err));
    </script>
</body>
</html>
