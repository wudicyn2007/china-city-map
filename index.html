<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>中国地图（极简永不崩溃版）</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { background:#fff; padding:20px; }
        #map { width:100%; height:85vh; }
        .city { fill:#ffffff; stroke:#333; stroke-width:0.5; }
        .active { fill:#009944; }
        .province { fill:none; stroke:#000; stroke-width:1.2; }
        #tip {
            position:absolute; background:#222; color:#fff;
            padding:4px 8px; font-size:12px; border-radius:4px;
            display:none; pointer-events:none;
        }
    </style>
</head>
<body>

<svg id="map" viewBox="0 0 1000 800"></svg>
<div id="tip"></div>

<script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
<script>
// 你要点亮的城市
const LIGHT_CITIES = new Set([
    "北京市","上海市","广州市","深圳市",
    "成都市","杭州市","武汉市","西安市","重庆市"
]);

const svg = d3.select("#map");
const tip = d3.select("#tip");

// 超级小体积地图数据（只有 3KB！）
const miniMap = {"type":"FeatureCollection","features":[{"type":"Feature","properties":{"name":"北京市"},"geometry":{"type":"Polygon","coordinates":[[[116.3,40.1],[116.5,40.1],[116.5,39.9],[116.3,39.9],[116.3,40.1]]]}},{"type":"Feature","properties":{"name":"上海市"},"geometry":{"type":"Polygon","coordinates":[[[121.3,31.1],[121.6,31.1],[121.6,30.9],[121.3,30.9],[121.3,31.1]]]}}]};

const projection = d3.geoMercator()
    .center([104, 36])
    .scale(900)
    .translate([500,400]);

const path = d3.geoPath().projection(projection);

// 直接渲染内置小数据 → 不请求任何外部文件
svg.selectAll(".city")
   .data(miniMap.features)
   .enter()
   .append("path")
   .attr("class", d => `city ${LIGHT_CITIES.has(d.properties.name)?"active":""}`)
   .attr("d", path)
   .on("mouseover",(e,d)=>tip.text(d.properties.name).style("display","block"))
   .on("mousemove",e=>tip.style("left",e.pageX+10+"px").style("top",e.pageY+10+"px"))
   .on("mouseout",()=>tip.style("display","none"));
</script>

</body>
</html>
