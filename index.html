<!DOCTYPE html>

<head>
    <meta charset="UTF-8">

    <title>中国地级市点亮地图</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #fff;
            padding: 20px;
            font-family: system-ui;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        #map {
            width: 100%;
            height: auto;
            background: #ffffff;
        }
        /* 地级市样式 */
        .city {
            fill: #ffffff;
            stroke: #333333;
            stroke-width: 0.3;
            cursor: pointer;
        }
        /* 点亮样式（和你示范的绿色一致） */
        .city.light {
            fill: #00882b;
        }
        /* 省级边界（加粗） */
        .province-line {
            fill: none;
            stroke: #000000;
            stroke-width: 0.8;
            pointer-events: none;
        }
        /* 悬浮提示 */
        #tip {
            position: absolute;
            background: rgba(0,0,0,0.8);
            color: #fff;
            padding: 4px 8px;
            border-radius: 3px;
            font-size: 12px;
            pointer-events: none;
            display: none;
            z-index: 999;
        }
    </style>
</head>

    <script>
        // 悬浮提示逻辑
        const cities = document.querySelectorAll(".city");
        const tip = document.getElementById("tip");

        cities.forEach(city => {
            city.addEventListener("mouseenter", () => {
                tip.textContent = city.getAttribute("data-name");
                tip.style.display = "block";
            });
            city.addEventListener("mousemove", (e) => {
                tip.style.left = e.pageX + 10 + "px";
                tip.style.top = e.pageY + 10 + "px";
            });
            city.addEventListener("mouseleave", () => {
                tip.style.display = "none";
            });
        });
    </script>
