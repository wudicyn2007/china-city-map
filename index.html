    <title>中国地级市点亮地图</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #f5f5f5;
            padding: 20px;
        }

        .title {
            text-align: center;
            font-size: 22px;
            margin-bottom: 15px;
            color: #333;
        }

        .map-container {
            position: relative;
            width: 900px;
            margin: 0 auto;
        }

        .map-bg {
            width: 100%;
            display: block;
        }

        .city-dot {
            position: absolute;
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #bbbbbb;
            transform: translate(-50%, -50%);
            cursor: pointer;
            transition: all 0.2s;
            z-index: 10;
        }

        .city-dot.light {
            background: #ff4d4f;
            box-shadow: 0 0 5px #ff4d4f;
        }

        .city-dot:hover::after {
            content: attr(data-name);
            position: absolute;
            bottom: 12px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.7);
            color: #fff;
            padding: 3px 6px;
            border-radius: 3px;
            font-size: 12px;
            white-space: nowrap;
            z-index: 20;
        }
    </style>
</head>

        function renderCities() {
            const container = document.getElementById('cityDots');
            container.innerHTML = '';

            cities.forEach(city => {
                const dot = document.createElement('div');
                dot.className = 'city-dot';
                if (city.light) dot.classList.add('light');
                dot.style.left = city.x + 'px';
                dot.style.top = city.y + 'px';
                dot.setAttribute('data-name', city.name);
                container.appendChild(dot);
            });
        }

        renderCities();
    </script>
</body>
</html>
