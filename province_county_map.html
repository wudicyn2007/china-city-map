    function parseNumber(value) {
      const text = String(value ?? "")
        .trim()
        .replace(/,/g, "")
        .replace(/%$/, "")
        .replace(/万/g, "0000");
      if (!text) return NaN;
      const number = Number(text);
      return Number.isFinite(number) ? number : NaN;
    }

    function interpolateColor(a, b, t) {
      const c1 = a.match(/\w\w/g).map((x) => parseInt(x, 16));
      const c2 = b.match(/\w\w/g).map((x) => parseInt(x, 16));
      const rgb = c1.map((value, index) => Math.round(value + (c2[index] - value) * t));
      return `#${rgb.map((value) => value.toString(16).padStart(2, "0")).join("")}`;
    }

    function parseBoundaryList(text) {
      return String(text || "")
        .split(/[\s,，;；|]+/)
        .map(parseNumber)
        .filter(Number.isFinite)
        .sort((a, b) => a - b);
    }

    function numericBoundaries(min, max) {
      const count = clamp(Math.floor(Number(savedSettings.bucketCount) || 7), 2, 12);
      const custom = parseBoundaryList(savedSettings.bucketBoundaries);
      if (custom.length >= count + 1) {
        return custom.slice(0, count + 1);
      }
      if (custom.length >= count - 1) {
        return [min, ...custom.slice(0, count - 1), max].sort((a, b) => a - b);
      }
      return Array.from({ length: count + 1 }, (_, index) => min + ((max - min) * index) / count);
    }

    function activeBucketColors() {
      return Array.from({ length: savedSettings.bucketCount }, (_, index) => {
        const color = savedSettings.bucketColors[index];
        return isHexColor(color) ? color : DEFAULT_COLORS[index % DEFAULT_COLORS.length];
      });
    }

    function colorForNumber(value, min, max) {
      const colorsForBuckets = activeBucketColors();
      if (max === min) return colorsForBuckets[colorsForBuckets.length - 1];
      const ratio = clamp((value - min) / (max - min), 0, 1);
      if (savedSettings.numericMode === "gradient") {
        return interpolateColor(savedSettings.gradientLowColor, savedSettings.gradientHighColor, ratio);
      }
      const boundaries = numericBoundaries(min, max);
      let index = boundaries.findIndex((boundary, boundaryIndex) => boundaryIndex > 0 && value <= boundary) - 1;
      if (index < 0) {
        index = colorsForBuckets.length - 1;
      }
      return colorsForBuckets[clamp(index, 0, colorsForBuckets.length - 1)];
    }

    function formatNumber(value) {
      if (!Number.isFinite(value)) return "";
      const rounded = Math.round(value * 100) / 100;
      return String(rounded).replace(/\B(?=(\d{3})+(?!\d))/g, ",");
    }

    function updateLegend(items) {
      applyLegendVisualSize();
      latestLegend = Array.isArray(items) ? items : [];
      if (!latestLegend.length) {
        legend.classList.add("hidden");
        legendBar.innerHTML = "";
        legendLabels.innerHTML = "";
        return;
      }

      legend.classList.remove("hidden");
      legendBar.innerHTML = "";
      legendLabels.innerHTML = "";
      legendBar.style.gridTemplateColumns = `repeat(${latestLegend.length}, minmax(0, 1fr))`;
      latestLegend.forEach((item) => {
        const segment = document.createElement("span");
        segment.style.background = item.color;
        legendBar.appendChild(segment);
      });

      const markers = latestLegend[0].markers || [];
      markers.forEach((marker, index) => {
        const label = document.createElement("span");
        label.style.left = `${marker.position}%`;
        label.textContent = marker.label;
        legendLabels.appendChild(label);
      });
      renderLegendLabelEditor();
    }

    function buildBucketLegend(min, max) {
      const boundaries = numericBoundaries(min, max);
      const count = boundaries.length - 1;
      const items = Array.from({ length: count }, (_, index) => ({
        color: colorForNumber((boundaries[index] + boundaries[index + 1]) / 2, min, max)
      }));
      latestLegendDefaultLabels = boundaries.map(formatNumber);
      const labels = savedSettings.legendLabels.length === latestLegendDefaultLabels.length
        ? savedSettings.legendLabels
        : latestLegendDefaultLabels;
      const markers = boundaries.map((boundary, index) => ({
        position: (index / count) * 100,
        label: labels[index] ?? formatNumber(boundary)
      }));
      items[0].markers = markers;
      updateLegend(items);
    }

    function parseRuleLines() {
      return String(savedSettings.rulesText || "")
        .split(/\r?\n/)
        .map((line) => line.trim())
        .filter(Boolean)
        .map((line) => {
          const match = line.match(/^(.+?)\s*=\s*(#[0-9a-f]{6})$/i);
          if (!match) return null;
          return { test: match[1].trim(), color: match[2].toLowerCase() };
        })
        .filter(Boolean);
    }

    function ruleColorForValue(value) {
      const text = String(value ?? "").trim();
      const number = parseNumber(text);
      for (const rule of parseRuleLines()) {
        const test = rule.test;
        const compare = test.match(/^(>=|<=|>|<)\s*(-?\d+(?:\.\d+)?)$/);
        if (compare && Number.isFinite(number)) {
          const target = Number(compare[2]);
          if (compare[1] === ">=" && number >= target) return rule.color;
          if (compare[1] === "<=" && number <= target) return rule.color;
          if (compare[1] === ">" && number > target) return rule.color;
          if (compare[1] === "<" && number < target) return rule.color;
          continue;
        }
        const range = test.match(/^(-?\d+(?:\.\d+)?)\s*[-~至]\s*(-?\d+(?:\.\d+)?)$/);
        if (range && Number.isFinite(number)) {
          const min = Math.min(Number(range[1]), Number(range[2]));
          const max = Math.max(Number(range[1]), Number(range[2]));
          if (number >= min && number <= max) return rule.color;
          continue;
        }
        if (test === "其他" || test.toLowerCase() === "other") {
          return rule.color;
        }
        if (text.includes(test)) {
          return rule.color;
        }
      }
      return "";
    }

    function reapplyImportedDataColors() {
      const fillIndex = clamp(Number(savedSettings.excelDataColumn) || 1, 1, RANK_DATA_COLUMN_COUNT);
      const matched = Object.entries(importedData)
        .filter(([code]) => countyLayerByCode.has(code))
        .map(([code, data]) => ({ code, ...data, value: data?.[`data${fillIndex}`] ?? "" }));
      if (!matched.length) return false;
      const applied = applyColorsFromMatchedRows(matched, fillIndex, { keepStatus: true });
      preparePlaybackRecords(applied, { progressFromStoredColors: true });
      refreshCountyStyles();
      return true;
    }

    function colorAssignmentsFromMatchedRows(matched, options = {}) {
      const assignments = [];
      const uncolored = [];
      matched.forEach((item) => {
        const ruleColor = ruleColorForValue(item.value);
        if (ruleColor) {
          assignments.push({
            ...item,
            fillColor: ruleColor,
            number: parseNumber(item.value)
          });
        } else {
          uncolored.push(item);
        }
      });

      const numericValues = uncolored
        .map((item) => ({ ...item, number: parseNumber(item.value) }))
        .filter((item) => Number.isFinite(item.number));

      if (numericValues.length === uncolored.length && numericValues.length) {
        const min = Math.min(...numericValues.map((item) => item.number));
        const max = Math.max(...numericValues.map((item) => item.number));
        numericValues.forEach((item) => {
          assignments.push({
            ...item,
            fillColor: colorForNumber(item.number, min, max)
          });
        });
        if (options.updateLegend !== false) {
          buildBucketLegend(min, max);
        }
      } else if (uncolored.length) {
        const categoryColors = new Map();
        uncolored.forEach((item) => {
          const value = String(item.value ?? "").trim();
          if (isHexColor(value)) {
            assignments.push({
              ...item,
              fillColor: value.toLowerCase(),
              number: parseNumber(item.value)
            });
          } else {
            if (!categoryColors.has(value)) {
              categoryColors.set(value, activeBucketColors()[categoryColors.size % activeBucketColors().length]);
            }
            assignments.push({
              ...item,
              fillColor: categoryColors.get(value),
              number: parseNumber(item.value)
            });
          }
        });
        if (options.updateLegend !== false) {
          updateLegend([]);
        }
      } else {
        if (options.updateLegend !== false) {
          updateLegend([]);
        }
      }

      return assignments;
    }

    function applyColorsFromMatchedRows(matched, fillIndex, options = {}) {
      const assignments = colorAssignmentsFromMatchedRows(matched, { updateLegend: options.updateLegend !== false });
      assignments.forEach((item) => {
        colors[item.code] = item.fillColor;
      });
      saveColors();
      if (!options.keepStatus) {
        updateStatus(`已按数据${fillIndex}重新填色。`);
      }
      return assignments;
    }

    function loadXlsxLibrary() {
      if (window.XLSX) return Promise.resolve(window.XLSX);
      if (!xlsxLoadPromise) {
        updateStatus("正在加载 Excel 读取组件...");
        xlsxLoadPromise = new Promise((resolve, reject) => {
          const script = document.createElement("script");
          script.src = XLSX_SCRIPT_URL;
          script.async = true;
          script.onload = () => resolve(window.XLSX);
          script.onerror = () => reject(new Error("Excel 读取组件加载失败"));
          document.head.appendChild(script);
        });
      }
      return xlsxLoadPromise;
    }

    function likelyHeader(row, columns = getImportColumnIndexes()) {
      const first = String(row?.[columns.name] ?? "");
      const dataCells = DATA_KEYS.map((key) => row?.[columns[key]]);
      return /名称|县|区|市|行政区|adcode|代码/i.test(first)
        && dataCells.some((cell) => /数据|值|指标|GDP|面积|人口|所属|地市|城市|排名|名次/i.test(String(cell)));
    }

    function isDefaultRankTitle(title, columnIndex) {
      const text = normalizeText(title);
      const defaults = new Set([
        normalizeText(RANK_COLUMNS[columnIndex]?.label),
        `数据${columnIndex - 2}`,
        `列${columnIndex + 1}`
      ]);
      if (columnIndex === 3) {
        defaults.add("数据");
      }
      return !text || defaults.has(text);
    }

    function applyImportedDataColumnTitles(dataLabels) {
      const labels = Array.isArray(dataLabels)
        ? dataLabels.map((label) => {
          const text = String(label ?? "").trim();
          return text && !isAuxiliaryImportHeader(text) ? text : "";
        }).slice(0, RANK_DATA_COLUMN_COUNT)
        : [];
      const usefulLabels = labels.filter(Boolean);
      if (!usefulLabels.length) return;

      const neededColumns = Math.min(RANK_COLUMNS.length, 3 + Math.max(1, usefulLabels.length));
      if (getRankColumnCount() !== neededColumns) {
        rankColumnCount.value = String(neededColumns);
        syncRankColumnTitleInputs();
      }

      const titleInputs = Array.from(rankColumnTitleFields.querySelectorAll("input[data-rank-column-index]"));
      labels.forEach((label, dataIndex) => {
        const columnIndex = 3 + dataIndex;
        const input = titleInputs[columnIndex];
        const nextTitle = String(label || "").trim();
        if (input && nextTitle && isDefaultRankTitle(input.value, columnIndex)) {
          input.value = nextTitle;
        }
      });
      applyRankSettingsToTable(true);
    }

    async function importExcel(file) {
      try {
        await loadXlsxLibrary();
      } catch (error) {
        updateStatus("Excel 读取组件加载失败，请确认网络可访问 jsDelivr。");
        return;
      }

      const reader = new FileReader();
      reader.onload = () => {
        try {
          const workbook = XLSX.read(reader.result, { type: "array" });
          const sheet = workbook.Sheets[workbook.SheetNames[0]];
          const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: "", raw: false });
          importExcelRows(rows);
        } catch (error) {
          console.error(error);
          updateStatus("Excel 解析失败，请检查文件格式。");
        }
      };
      reader.readAsArrayBuffer(file);
    }

    function importExcelRows(rows) {
      latestReportRows = [];
      const importColumnSettings = {
        importNameColumn: ruleImportNameColumn ? ruleImportNameColumn.value : savedSettings.importNameColumn,
        ...Object.fromEntries(ruleImportDataColumns.map((input, index) => [
          `importData${index + 1}Column`,
          input?.value || savedSettings[`importData${index + 1}Column`] || DEFAULT_IMPORT_DATA_COLUMNS[index]
        ]))
      };
      let importColumns = getImportColumnIndexes(importColumnSettings);
      const dataRows = rows
        .map((row, index) => ({ row, rowNumber: index + 1 }))
        .filter(({ row }) => row.some((cell) => String(cell ?? "").trim()));

      if (dataRows.length && likelyHeader(dataRows[0].row, importColumns)) {
        const header = dataRows.shift().row;
        importColumns = importColumnsFromHeader(header, importColumns);
        applyImportedDataColumnTitles(DATA_KEYS.map((key) => header[importColumns[key]]));
      }

      const fillIndex = clamp(Number(excelDataColumn.value) || 1, 1, RANK_DATA_COLUMN_COUNT);
      const matched = [];
      const unmatched = [];

      dataRows.forEach(({ row, rowNumber }) => {
        const name = row[importColumns.name];
        const code = matchCounty(name);
        const data = {
          rowNumber,
          sourceName: String(name ?? "").trim(),
          ...Object.fromEntries(DATA_KEYS.map((key) => [key, cellByIndex(row, importColumns[key])]))
        };

        if (!code) {
          unmatched.push({ rowNumber, ...data });
          latestReportRows.push({ rowNumber, matchedName: "", ...data });
          return;
        }

        importedData[code] = {
          ...data,
          matchedName: countyMetaByCode.get(code)?.name || code
        };
        matched.push({ rowNumber, code, ...data, value: data[`data${fillIndex}`] });
        latestReportRows.push({
          rowNumber,
          matchedName: countyMetaByCode.get(code)?.name || code,
          ...data
        });
      });

      const applied = applyColorsFromMatchedRows(matched, fillIndex, { keepStatus: true });

      saveData();
      saveSettings();
      refreshCountyStyles();
      preparePlaybackRecords(applied, { progressFromStoredColors: true });
      syncReportButton();
      renderReport();
      renderRankTable();
      updateStatus(`Excel 导入完成：匹配 ${matched.length} 行，未匹配 ${unmatched.length} 行，已按数据${fillIndex}填色。`, 100);
    }

    function rebuildReportRowsFromImportedData() {
      if (latestReportRows.length || !Object.keys(importedData).length) return;
      latestReportRows = Object.entries(importedData).map(([code, data], index) => {
        const meta = countyMetaByCode.get(code);
        return {
          rowNumber: data.rowNumber || index + 1,
          sourceName: data.sourceName || meta?.name || code,
          matchedName: data.matchedName || meta?.name || code,
          ...Object.fromEntries(DATA_KEYS.map((key) => [key, data?.[key] ?? ""]))
        };
      });
    }

    function hasReportRows() {
      return Boolean(latestReportRows.length || Object.keys(importedData).length);
    }

    function syncReportButton() {
      reportButton.classList.toggle("hidden", !hasReportRows());
    }

    function renderReport() {
      rebuildReportRowsFromImportedData();
      if (!latestReportRows.length) {
        reportSummary.textContent = "还没有导入县级数据。";
        reportBody.innerHTML = "";
        return;
      }
      reportSummary.textContent = `共 ${latestReportRows.length} 行；已匹配 ${latestReportRows.filter((row) => row.matchedName).length} 行，未匹配 ${latestReportRows.filter((row) => !row.matchedName).length} 行。`;
      reportBody.innerHTML = "";
      latestReportRows.forEach((row) => {
        const tr = document.createElement("tr");
        [row.rowNumber, row.sourceName, row.matchedName || "未匹配", ...DATA_KEYS.map((key) => row[key])].forEach((value) => {
          const td = document.createElement("td");
          td.textContent = value ?? "";
          tr.appendChild(td);
        });
        reportBody.appendChild(tr);
      });
    }

    function boundedInteger(value, min, max, fallback) {
      const number = Math.round(Number(value));
      if (!Number.isFinite(number)) {
        return fallback;
      }
      return Math.max(min, Math.min(max, number));
    }

    function getRankVisibleRowCount() {
      return boundedInteger(rankVisibleRows.value, 1, 100, 10);
    }

    function getRankColumnCount() {
      return boundedInteger(rankColumnCount.value, 1, RANK_COLUMNS.length, savedSettings.rankColumnCount || 4);
    }

    function syncRankColumnTitleInputs(nextTitles, nextWidths) {
      const count = getRankColumnCount();
      rankColumnCount.value = String(count);
      const savedTitles = Array.isArray(nextTitles) ? nextTitles : [];
      const savedWidths = Array.isArray(nextWidths) ? nextWidths : [];
      const existingInputs = Array.from(rankColumnTitleFields.querySelectorAll("input"));
      const existingTitles = existingInputs.filter((input) => input.dataset.rankColumnIndex).map((input) => input.value);
      const existingWidths = existingInputs.filter((input) => input.dataset.rankColumnWidthIndex).map((input) => input.value);
      rankColumnTitleFields.innerHTML = "";

      for (let index = 0; index < count; index += 1) {
        const titleField = document.createElement("label");
        titleField.className = "rank-settings-field";
        titleField.textContent = `第${index + 1}列标题`;

        const titleInput = document.createElement("input");
        titleInput.type = "text";
        titleInput.value = savedTitles[index] || existingTitles[index] || RANK_COLUMNS[index].label;
        titleInput.dataset.rankColumnIndex = String(index);
        titleInput.setAttribute("aria-label", `第${index + 1}列标题`);
        titleField.appendChild(titleInput);
        rankColumnTitleFields.appendChild(titleField);

        const widthField = document.createElement("label");
        widthField.className = "rank-settings-field";
        widthField.textContent = `第${index + 1}列宽度`;

        const widthInput = document.createElement("input");
        widthInput.type = "number";
        widthInput.min = "20";
        widthInput.max = "220";
        widthInput.step = "1";
        widthInput.value = String(savedWidths[index] || existingWidths[index] || RANK_COLUMN_WIDTHS[index] || 70);
        widthInput.dataset.rankColumnWidthIndex = String(index);
        widthInput.setAttribute("aria-label", `第${index + 1}列宽度`);
        widthField.appendChild(widthInput);
        rankColumnTitleFields.appendChild(widthField);
      }
    }

    function getRankColumnTitles() {
      const inputs = Array.from(rankColumnTitleFields.querySelectorAll("input[data-rank-column-index]"));
      return RANK_COLUMNS.map((column, index) => inputs[index]?.value.trim() || savedSettings.rankColumnTitles?.[index] || column.label);
    }

    function getRankColumnWidths() {
      const inputs = Array.from(rankColumnTitleFields.querySelectorAll("input[data-rank-column-width-index]"));
      return RANK_COLUMNS.map((column, index) => {
        const value = Number(inputs[index]?.value ?? savedSettings.rankColumnWidths?.[index]);
        return Number.isFinite(value) && value > 0 ? value : (RANK_COLUMN_WIDTHS[index] || 70);
      });
    }

    function syncRankTableColumnWidths(columnCount = getRankColumnCount()) {
      let colgroup = rankTable.querySelector("colgroup");
      if (!colgroup) {
        colgroup = document.createElement("colgroup");
        rankTable.prepend(colgroup);
      }
      colgroup.innerHTML = "";
      const widths = getRankColumnWidths().slice(0, columnCount);
      const totalWidth = widths.reduce((sum, width) => sum + (width || 70), 0);
      rankTable.style.width = `${totalWidth}px`;
      for (let index = 0; index < columnCount; index += 1) {
        const column = document.createElement("col");
        column.style.width = `${widths[index] || 70}px`;
        colgroup.appendChild(column);
      }
    }

    function applyRankSettingsToTable(persist = false) {
      rankVisibleRows.value = String(getRankVisibleRowCount());
      syncRankColumnTitleInputs();
      syncRankTableColumnWidths();
      rankTableHeaderRow.innerHTML = "";
      getRankColumnTitles().slice(0, getRankColumnCount()).forEach((title) => {
        const cell = document.createElement("th");
        cell.textContent = title;
        rankTableHeaderRow.appendChild(cell);
      });
      renderRankTable(Number(playbackRange.value) || 0);
      if (persist) {
        saveSettings();
      }
    }

    function rankColumnValue(record, index) {
      if (index === 0) return String(record.rank ?? "");
      if (index === 1) {
        const rank = record.parentRank ?? "";
        const name = record.parentRankName || shortParentRankName(record.parentName);
        return rank ? `${name}${rank}` : name;
      }
      if (index === 2) return String(record.name ?? "");
      if (index >= RANK_BASE_COLUMN_COUNT && index < RANK_BASE_COLUMN_COUNT + RANK_DATA_COLUMN_COUNT) {
        return String(record[`data${index - RANK_BASE_COLUMN_COUNT + 1}`] ?? "");
      }
      return "";
    }

    function selectedRankColumn() {
      return clamp(Math.floor(Number(rankSortColumn.value) || savedSettings.excelDataColumn || 1), 1, RANK_DATA_COLUMN_COUNT);
    }

    function selectedPlaybackDirection() {
      return playbackDirection.value === "asc" || rankSortDirection.value === "asc" ? "asc" : "desc";
    }

    function matchedRowsFromImportedData(fillIndex = selectedRankColumn()) {
      const sortKey = `data${fillIndex}`;
      return Object.entries(importedData)
        .filter(([code]) => !countyLayerByCode.size || countyLayerByCode.has(code))
        .map(([code, data]) => {
          const meta = countyMetaByCode.get(code);
          const value = data?.[sortKey] ?? "";
          return {
            code,
            sourceName: data?.sourceName || meta?.name || code,
            matchedName: data?.matchedName || meta?.name || code,
            name: meta?.name || data?.matchedName || data?.sourceName || code,
            parentName: meta?.parentName || "",
            ...Object.fromEntries(DATA_KEYS.map((key) => [key, data?.[key] ?? ""])),
            value,
            number: parseNumber(value)
          };
        });
    }

    function compareRankDescending(a, b) {
      const aNumeric = Number.isFinite(a.number);
      const bNumeric = Number.isFinite(b.number);
      if (aNumeric !== bNumeric) return aNumeric ? -1 : 1;
      if (aNumeric && bNumeric) return b.number - a.number;
      return String(b.value ?? "").localeCompare(String(a.value ?? ""), "zh-Hans-CN", { numeric: true });
    }

    function comparePlaybackOrder(a, b) {
      const direction = selectedPlaybackDirection();
      const descending = compareRankDescending(a, b);
      return direction === "asc" ? -descending : descending;
    }

    function rankValueKey(row) {
      return Number.isFinite(row.number)
        ? `n:${row.number}`
        : `s:${String(row.value ?? "").trim()}`;
    }

    function assignPlaybackRanks(records) {
      const ranked = [...records].sort(compareRankDescending);
      let lastKey = "";
      let lastRank = 0;
      ranked.forEach((row, index) => {
        const key = rankValueKey(row);
        if (index === 0 || key !== lastKey) {
          lastRank = index + 1;
          lastKey = key;
        }
        row.rank = lastRank;
      });
    }

    function assignParentRanks(records) {
      const groups = new Map();
      records.forEach((row) => {
        const key = row.parentName || "";
        if (!groups.has(key)) {
          groups.set(key, []);
        }
        groups.get(key).push(row);
      });
      groups.forEach((rows, parentName) => {
        const ranked = [...rows].sort(compareRankDescending);
        let lastKey = "";
        let lastRank = 0;
        ranked.forEach((row, index) => {
          const key = rankValueKey(row);
          if (index === 0 || key !== lastKey) {
            lastRank = index + 1;
            lastKey = key;
          }
          row.parentRank = lastRank;
          row.parentRankName = shortParentRankName(parentName);
        });
      });
    }

    function playbackProgressFromStoredColors() {
      let count = 0;
      for (const record of playbackRecords) {
        if (String(colors[record.code] || "").toLowerCase() !== String(record.fillColor || "").toLowerCase()) {
          break;
        }
        count += 1;
      }
      return count;
    }

    function preparePlaybackRecords(appliedRecords = null, options = {}) {
      const fillIndex = selectedRankColumn();
      const baseRecords = Array.isArray(appliedRecords) && appliedRecords.length
        ? appliedRecords
        : colorAssignmentsFromMatchedRows(matchedRowsFromImportedData(fillIndex), { updateLegend: options.updateLegend !== false });
      playbackRecords = baseRecords
        .filter((record) => record?.code)
        .map((record) => {
          const meta = countyMetaByCode.get(record.code);
          return {
            ...record,
            name: meta?.name || record.matchedName || record.sourceName || record.code,
            parentName: meta?.parentName || record.parentName || "",
            number: Number.isFinite(record.number) ? record.number : parseNumber(record.value)
          };
        });
      assignPlaybackRanks(playbackRecords);
      assignParentRanks(playbackRecords);
      playbackRecords.sort(comparePlaybackOrder);
      const progress = options.progressFromStoredColors
        ? playbackProgressFromStoredColors()
        : clamp(Math.floor(Number(options.progress ?? playbackRecords.length) || 0), 0, playbackRecords.length);
      updatePlaybackUI(progress);
      if (!options.skipRender) {
        renderRankTable(progress);
      }
      return playbackRecords;
    }

    function updatePlaybackUI(count = Number(playbackRange.value) || 0) {
      const bounded = clamp(Math.floor(Number(count) || 0), 0, playbackRecords.length);
      playbackRange.max = String(playbackRecords.length);
      playbackRange.value = String(bounded);
      playbackCount.textContent = `${bounded} / ${playbackRecords.length}`;
      if (!playbackRecords.length) {
        playButton.textContent = "播放";
        setRankPanelVisible(false);
      }
    }

    function renderRankTable(count = null) {
      let requestedCount = count;
      if (!playbackRecords.length && Object.keys(importedData).length) {
        preparePlaybackRecords(null, { progressFromStoredColors: true, skipRender: true });
        if (requestedCount === null) {
          requestedCount = Number(playbackRange.value) || 0;
        }
      }
      const visibleRows = getRankVisibleRowCount();
      const columnCount = getRankColumnCount();
      const bounded = clamp(Math.floor(Number(requestedCount ?? playbackRange.value) || 0), 0, playbackRecords.length);
      savedSettings.rankSortColumn = selectedRankColumn();
      savedSettings.rankSortDirection = selectedPlaybackDirection();
      savedSettings.rankVisibleRows = visibleRows;
      savedSettings.rankColumnCount = columnCount;
      savedSettings.rankColumnTitles = getRankColumnTitles();
      savedSettings.rankColumnWidths = getRankColumnWidths();
      syncRankTableColumnWidths(columnCount);
      rankBody.innerHTML = "";

      if (!playbackRecords.length) {
        rankEmpty.textContent = "导入 Excel 后，这里会显示播放榜单。";
        rankEmpty.style.display = "block";
        updatePlaybackUI(0);
        return;
      }

      const recentRows = playbackRecords.slice(Math.max(0, bounded - visibleRows), bounded).reverse();
      rankEmpty.textContent = recentRows.length ? "" : "拖动进度条或点击播放后，这里会显示已经出现的县级区域。";
      rankEmpty.style.display = recentRows.length ? "none" : "block";
      recentRows.forEach((row) => {
        const tr = document.createElement("tr");
        for (let index = 0; index < columnCount; index += 1) {
          const td = document.createElement("td");
          const value = rankColumnValue(row, index);
          td.textContent = value;
          td.title = value;
          tr.appendChild(td);
        }
        rankBody.appendChild(tr);
      });
    }

    function setPlaybackProgress(count, options = {}) {
      if (!playbackRecords.length && Object.keys(importedData).length) {
        preparePlaybackRecords(null, { progressFromStoredColors: true, skipRender: true });
      }
      const previous = Number(playbackRange.value) || 0;
      const bounded = clamp(Math.floor(Number(count) || 0), 0, playbackRecords.length);
      const playbackCodes = new Set(playbackRecords.map((record) => record.code));
      playbackCodes.forEach((code) => delete colors[code]);
      playbackRecords.slice(0, bounded).forEach((record) => {
        colors[record.code] = record.fillColor;
      });
      clearSelectedOutline();
      selectedLayer = null;
      refreshCountyStyles();
      updatePlaybackUI(bounded);
      renderRankTable(bounded);
      if (options.animate && bounded > previous) {
        animatePlaybackRecord(playbackRecords[bounded - 1]);
      } else if (bounded === 0) {
        clearPlaybackAnimationLayer();
      }
      if (options.persist) {
        saveColors();
      }
    }

    function stopPlayback() {
      if (playbackStartTimer) {
        clearTimeout(playbackStartTimer);
        playbackStartTimer = null;
      }
      if (playbackTimer) {
        clearInterval(playbackTimer);
        playbackTimer = null;
      }
      playButton.textContent = "播放";
    }

    function beginPlaybackInterval() {
      playbackStartTimer = null;
      playButton.textContent = "暂停";
      playbackTimer = setInterval(() => {
        const next = Number(playbackRange.value) + 1;
        setPlaybackProgress(next, { animate: true });
        if (next >= playbackRecords.length) {
          stopPlayback();
          saveColors();
        }
      }, Math.max(1, Number(playbackSpeed.value) || 500));
    }

    function startPlayback() {
      if (!playbackRecords.length) {
        preparePlaybackRecords(null, { progressFromStoredColors: true });
      }
      if (!playbackRecords.length) {
        updateStatus("请先导入县级 Excel 数据。");
        return;
      }
      if (Number(playbackRange.value) >= playbackRecords.length) {
        setPlaybackProgress(0);
      }
      const delay = Math.max(0, Number(playbackDelay.value) || 0);
      if (delay > 0) {
        playButton.textContent = "等待";
        playbackStartTimer = setTimeout(beginPlaybackInterval, delay);
        return;
      }
      beginPlaybackInterval();
    }

    function saveRankViewSettings() {
      stopPlayback();
      playbackDirection.value = rankSortDirection.value;
      Object.assign(savedSettings, {
        rankSortColumn: selectedRankColumn(),
        rankSortDirection: selectedPlaybackDirection(),
        rankVisibleRows: getRankVisibleRowCount(),
        rankColumnCount: getRankColumnCount(),
        rankColumnTitles: getRankColumnTitles(),
        rankColumnWidths: getRankColumnWidths(),
        playbackSpeed: clamp(Math.floor(Number(playbackSpeed.value) || 500), 1, 600000),
        playbackDelay: clamp(Math.floor(Number(playbackDelay.value) || 0), 0, 600000)
      });
      preparePlaybackRecords(null, { progressFromStoredColors: true });
      saveSettings();
    }

    function exportColors() {
      const payload = {
        province: PROVINCE,
        colors,
        importedData,
        settings: readJson(SETTINGS_KEY, {}),
        exportedAt: new Date().toISOString()
      };
      const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = `${PROVINCE.name}县级填色方案.json`;
      link.click();
      URL.revokeObjectURL(url);
    }

    function importColors(file) {
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const payload = JSON.parse(reader.result);
          Object.keys(colors).forEach((key) => delete colors[key]);
          Object.entries(payload.colors || payload || {}).forEach(([code, color]) => {
            const adcode = asAdcode(code);
            if (countyLayerByCode.has(adcode) && isHexColor(color)) {
              colors[adcode] = String(color).toLowerCase();
            }
          });
          Object.keys(importedData).forEach((key) => delete importedData[key]);
          Object.assign(importedData, payload.importedData || {});
          if (payload.settings && typeof payload.settings === "object") {
            Object.assign(savedSettings, sanitizeSettings({ ...savedSettings, ...payload.settings }));
            writeJson(SETTINGS_KEY, savedSettings);
            applySettingsToTopControls();
            syncRulePanelFromSettings();
            applyLegendVisualSize();
            renderLegendLabelEditor();
          }
          latestReportRows = [];
          saveColors();
          saveData();
          refreshCountyStyles();
          preparePlaybackRecords(null, { progressFromStoredColors: true });
          syncReportButton();
          renderReport();
          renderRankTable();
          updateStatus(`已导入填色方案：${Object.keys(colors).length} 个县级区域。`);
        } catch (error) {
          updateStatus("填色方案导入失败，请确认 JSON 格式。");
        }
      };
      reader.readAsText(file, "utf-8");
    }

    async function initMap() {
      try {
        updateStatus(`正在加载${PROVINCE.name}边界...`, 8);
        const provinceGeo = await fetchGeoJson(PROVINCE.adcode, false);
        const provinceFullGeo = await fetchGeoJson(PROVINCE.adcode, true);
        const provinceChildren = (provinceFullGeo.features || []).filter((feature) => feature.geometry);

        provinceLayer = L.geoJSON(provinceGeo, { style: provinceStyle }).addTo(map);
        const cityFeatures = provinceChildren.filter(shouldLoadChildCounties);
        cityLayer = L.geoJSON(cityFeatures, { style: cityStyle }).addTo(map);
        provinceBounds = provinceLayer.getBounds();
        cityFeatures.forEach((feature) => cityCodes.add(getFeatureCode(feature)));

        const countyFeatures = [];
        provinceChildren.filter((feature) => !shouldLoadChildCounties(feature)).forEach((feature) => {
          buildCountyIndexes(feature, PROVINCE.name);
          countyFeatures.push(feature);
        });

        updateStatus(`正在加载县级边界：0 / ${cityCodes.size}`, 18);
        let loaded = 0;
        for (const cityCode of cityCodes) {
          const parentName = (cityFeatures.find((feature) => getFeatureCode(feature) === cityCode)?.properties?.name) || PROVINCE.name;
          try {
            const geo = await fetchGeoJson(cityCode, true);
            const children = (geo.features || []).filter((feature) => feature.geometry);
            if (children.length) {
              children.forEach((feature) => {
                buildCountyIndexes(feature, parentName);
                countyFeatures.push(feature);
              });
            } else {
              const fallback = cityFeatures.find((feature) => getFeatureCode(feature) === cityCode);
              if (fallback) {
                buildCountyIndexes(fallback, PROVINCE.name);
                countyFeatures.push(fallback);
              }
            }
          } catch (error) {
            const fallback = cityFeatures.find((feature) => getFeatureCode(feature) === cityCode);
            if (fallback) {
              buildCountyIndexes(fallback, PROVINCE.name);
              countyFeatures.push(fallback);
            }
          }
          loaded += 1;
          updateStatus(`正在加载县级边界：${loaded} / ${cityCodes.size}`, 18 + (loaded / cityCodes.size) * 62);
        }

        countyLayer = L.geoJSON(countyFeatures, {
          style: countyStyle,
          onEachFeature(feature, layer) {
            const code = getFeatureCode(feature);
            countyLayerByCode.set(code, layer);
            layer.bindTooltip(getFeatureName(feature), {
              className: "county-tooltip",
              sticky: true,
              direction: "top"
            });
            layer.on({
              mouseover: onCountyMouseOver,
              mouseout: onCountyMouseOut,
              click: onCountyClick
            });
          }
        }).addTo(map);

        if (cityLayer) cityLayer.bringToFront();
        provinceLayer.bringToFront();
        map.fitBounds(provinceBounds, { padding: [24, 24] });
        syncReportButton();
        if (!reportPanel.classList.contains("hidden")) renderReport();
        renderRankTable();
        updateStatus(`加载完成：${PROVINCE.name}上级边界 ${cityCodes.size} 个，县级边界 ${countyFeatures.length} 个，已填色 ${Object.keys(colors).length} 个。`, 100);
      } catch (error) {
        console.error(error);
        updateStatus(`${PROVINCE.name}县级边界加载失败，请确认网络可以访问 DataV GeoJSON。`, 100);
      }
    }

    function countyAiFillRulePatch(settings = {}) {
      const source = settings && typeof settings === "object" ? settings : {};
      const next = sanitizeSettings({ ...savedSettings });
      let numericTouched = false;
      let gradientTouched = false;
      let rulesTouched = false;

      const numericType = source.numericMode || source.numericFillType || source.mode;
      if (numericType === "gradient") {
        next.numericMode = "gradient";
        gradientTouched = true;
      } else if (["bucket", "buckets", "segment", "segments", "numeric"].includes(numericType)) {
        next.numericMode = "bucket";
        numericTouched = true;
      }
      if (source.excelDataColumn !== undefined) {
        next.excelDataColumn = clamp(Math.floor(Number(source.excelDataColumn) || next.excelDataColumn), 1, RANK_DATA_COLUMN_COUNT);
      } else if (source.fillDataIndex !== undefined) {
        next.excelDataColumn = clamp(Math.floor(Number(source.fillDataIndex) + 1 || next.excelDataColumn), 1, RANK_DATA_COLUMN_COUNT);
      }
      if (source.bucketCount !== undefined) {
        next.bucketCount = clamp(Math.floor(Number(source.bucketCount) || next.bucketCount), 2, 12);
        next.numericMode = "bucket";
        numericTouched = true;
      }
      if (Array.isArray(source.boundaries)) {
        next.bucketBoundaries = source.boundaries.join(" ");
        next.numericMode = "bucket";
        numericTouched = true;
      } else if (source.bucketBoundaries !== undefined) {
        next.bucketBoundaries = String(source.bucketBoundaries || "");
        next.numericMode = "bucket";
        numericTouched = true;
      }
      if (Array.isArray(source.bucketColors)) {
        next.bucketColors = source.bucketColors.filter(isHexColor).map((color) => String(color).toLowerCase());
        next.numericMode = "bucket";
        numericTouched = true;
      }
      if (Array.isArray(source.legendLabels)) {
        next.legendLabels = source.legendLabels.map((label) => String(label ?? ""));
      } else if (Array.isArray(source.bucketLegendLabels)) {
        next.legendLabels = source.bucketLegendLabels.map((label) => String(label ?? ""));
      }
      const legendBarWidth = source.legendBarWidth ?? source.bucketLegendBarWidth ?? source.colorBarWidth;
      if (legendBarWidth !== undefined) {
        next.legendBarWidth = clamp(Math.floor(Number(legendBarWidth) || next.legendBarWidth), 180, 1200);
      }
      const legendBarHeight = source.legendBarHeight ?? source.bucketLegendBarHeight ?? source.colorBarHeight;
      if (legendBarHeight !== undefined) {
        next.legendBarHeight = clamp(Math.floor(Number(legendBarHeight) || next.legendBarHeight), 8, 80);
      }
      const legendLabelFontSize = source.legendLabelFontSize ?? source.bucketLegendLabelFontSize ?? source.colorBarLabelFontSize;
      if (legendLabelFontSize !== undefined) {
        next.legendLabelFontSize = clamp(Math.floor(Number(legendLabelFontSize) || next.legendLabelFontSize), 8, 48);
      }
      if (isHexColor(source.gradientLowColor)) {
        next.gradientLowColor = String(source.gradientLowColor).toLowerCase();
        next.numericMode = "gradient";
        gradientTouched = true;
      }
      if (isHexColor(source.gradientHighColor)) {
        next.gradientHighColor = String(source.gradientHighColor).toLowerCase();
        next.numericMode = "gradient";
        gradientTouched = true;
      }
      if (source.rulesText !== undefined) {
        next.rulesText = String(source.rulesText || "");
        rulesTouched = true;
      }
      if ((numericTouched || gradientTouched || rulesTouched) && !Array.isArray(source.legendLabels) && !Array.isArray(source.bucketLegendLabels)) {
        next.legendLabels = [];
      }
      return sanitizeSettings(next);
    }

    function applyCountyAiFillRuleSettings(settings = {}) {
      const before = JSON.stringify(sanitizeSettings({ ...savedSettings }));
      const next = countyAiFillRulePatch(settings);
      Object.assign(savedSettings, next);
      writeJson(SETTINGS_KEY, savedSettings);
      applySettingsToTopControls();
      syncRulePanelFromSettings();
      applyLegendVisualSize();
      const after = JSON.stringify(sanitizeSettings({ ...savedSettings }));
      if (before === after) {
        return "页面没有检测到有效变化：AI 返回的设置与当前填色规则相同，或包含了不支持的字段。";
      }
      const applied = reapplyImportedDataColors();
      renderLegendLabelEditor();
      renderRankTable();
      if (!applied) {
        updateStatus("AI 已修改填色规则；当前没有可重算的导入数据，导入 Excel 后会按新规则填色。");
      }
      return applied ? "页面已确认：填色规则已修改，并已立即重新应用到当前县级数据。" : "页面已确认：填色规则已修改，等待导入数据后生效。";
    }

    function countyAiActiveDataIndex() {
      return clamp(Math.floor(Number(savedSettings.excelDataColumn) || 1), 1, RANK_DATA_COLUMN_COUNT);
    }

    function countyAiRoundBoundary(value) {
      return Number(Number(value).toFixed(8));
    }

    function countyAiRankRowsForDataIndex(fillIndex = countyAiActiveDataIndex()) {
      const sourceRows = playbackRecords.length
        ? playbackRecords.map((row) => ({ ...row }))
        : matchedRowsFromImportedData(fillIndex).map((row) => ({ ...row }));
      const rows = sourceRows
        .filter((row) => row?.code && (!countyLayerByCode.size || countyLayerByCode.has(row.code)))
        .map((row) => {
          const meta = countyMetaByCode.get(row.code);
          const value = row[`data${fillIndex}`] ?? row.value ?? "";
          const number = parseNumber(value);
          if (!Number.isFinite(number)) return null;
          return {
            ...row,
            name: meta?.name || row.matchedName || row.sourceName || row.code,
            parentName: meta?.parentName || row.parentName || "",
            value: String(value ?? ""),
            number
          };
        })
        .filter(Boolean);
      assignPlaybackRanks(rows);
      assignParentRanks(rows);
      rows.sort(comparePlaybackOrder);
      return rows;
    }

    function buildCountyAiRankDataContext() {
      const fillIndex = countyAiActiveDataIndex();
      const rows = countyAiRankRowsForDataIndex(fillIndex);
      const values = rows.map((row) => row.number).filter((value) => Number.isFinite(value));
      return {
        scope: `${PROVINCE.name}县级榜单`,
        activeDataIndex: fillIndex - 1,
        activeExcelDataColumn: fillIndex,
        activeDataColumn: `data${fillIndex}`,
        count: rows.length,
        numericCount: values.length,
        min: values.length ? Math.min(...values) : null,
        max: values.length ? Math.max(...values) : null,
        currentPlaybackDirection: selectedPlaybackDirection(),
        rows: rows.slice(0, 1000).map((row) => ({
          code: row.code,
          countyName: row.name,
          parentCity: row.parentName,
          totalRank: row.rank,
          parentRank: `${row.parentRankName || shortParentRankName(row.parentName)}${row.parentRank}`,
          activeValue: row.value,
          activeNumber: row.number,
          dataValues: Object.fromEntries(DATA_KEYS.map((key) => [key, row[key] ?? ""]))
        }))
      };
    }

    function countyEqualCountBoundariesFromRows(rows, bucketTotal) {
      const values = rows
        .map((row) => Number(row.number))
        .filter((value) => Number.isFinite(value))
        .sort((a, b) => a - b);
      if (values.length < 2 || bucketTotal < 2) return [];
      return Array.from({ length: bucketTotal - 1 }, (_, index) => {
        const position = Math.ceil((values.length * (index + 1)) / bucketTotal) - 1;
        return countyAiRoundBoundary(values[Math.max(0, Math.min(values.length - 1, position))]);
      });
    }

    function countyAiFormatBoundaryLabel(value, decimalPlaces) {
      const places = clamp(Math.floor(Number(decimalPlaces)), 0, 6);
      return Number(value).toLocaleString("zh-CN", {
        minimumFractionDigits: Number.isFinite(places) ? places : 1,
        maximumFractionDigits: Number.isFinite(places) ? places : 1
      });
    }

    function countyLegendLabelsForBoundaries(min, max, boundaries, decimalPlaces) {
      return [min, ...boundaries, max].map((value) => countyAiFormatBoundaryLabel(value, decimalPlaces));
    }

    function countyTopCountThenEqualBoundariesFromRows(rows, bucketTotal, topCount) {
      const valuesDesc = rows
        .map((row) => Number(row.number))
        .filter((value) => Number.isFinite(value))
        .sort((a, b) => b - a);
      if (valuesDesc.length < topCount + 1 || bucketTotal < 2) {
        return [];
      }
      const topValue = valuesDesc[topCount - 1];
      const nextValue = valuesDesc[topCount];
      if (topValue === nextValue) {
        throw new Error(`第 ${topCount} 名和第 ${topCount + 1} 名数值相同，无法只让前 ${topCount} 个进入最高段。`);
      }
      const topBoundary = countyAiRoundBoundary((topValue + nextValue) / 2);
      const lowerBucketTotal = bucketTotal - 1;
      const lowerValues = valuesDesc
        .filter((value) => value <= topBoundary)
        .sort((a, b) => a - b);
      const lowerBoundaries = Array.from({ length: Math.max(0, lowerBucketTotal - 1) }, (_, index) => {
        const position = Math.ceil((lowerValues.length * (index + 1)) / lowerBucketTotal) - 1;
        return countyAiRoundBoundary(lowerValues[Math.max(0, Math.min(lowerValues.length - 1, position))]);
      });
      return [...lowerBoundaries, topBoundary].sort((a, b) => a - b);
    }

    function applyCountyAiTopCountThenEqualBuckets(settings = {}) {
      const source = settings && typeof settings === "object" ? settings : {};
      const fallbackCount = clamp(Math.floor(Number(savedSettings.bucketCount) || 7), 2, 12);
      const bucketTotal = clamp(Math.floor(Number(source.bucketCount) || fallbackCount), 2, 12);
      const topCount = clamp(Math.floor(Number(source.topCount) || 10), 1, 9999);
      const fillIndex = source.fillDataIndex !== undefined
        ? clamp(Math.floor(Number(source.fillDataIndex) + 1 || countyAiActiveDataIndex()), 1, RANK_DATA_COLUMN_COUNT)
        : source.excelDataColumn !== undefined
          ? clamp(Math.floor(Number(source.excelDataColumn) || countyAiActiveDataIndex()), 1, RANK_DATA_COLUMN_COUNT)
          : countyAiActiveDataIndex();
      const rows = countyAiRankRowsForDataIndex(fillIndex);
      const boundaries = countyTopCountThenEqualBoundariesFromRows(rows, bucketTotal, topCount);
      if (!boundaries.length) {
        throw new Error("当前没有足够的县级榜单数字数据用于最高段固定数量分段。");
      }
      const values = rows.map((row) => row.number).filter((value) => Number.isFinite(value));
      const patch = {
        numericMode: "bucket",
        excelDataColumn: fillIndex,
        bucketCount: bucketTotal,
        boundaries
      };
      if (Array.isArray(source.bucketColors)) {
        patch.bucketColors = source.bucketColors;
      }
      if (source.legendDecimalPlaces !== undefined) {
        patch.legendLabels = countyLegendLabelsForBoundaries(Math.min(...values), Math.max(...values), boundaries, source.legendDecimalPlaces);
      } else if (Array.isArray(source.legendLabels)) {
        patch.legendLabels = source.legendLabels;
      }
      const appliedMessage = applyCountyAiFillRuleSettings(patch);
      return `${appliedMessage}\n已计算：最高颜色段保留前 ${topCount} 个，剩余 ${Math.max(0, rows.length - topCount)} 个按数量拆成 ${bucketTotal - 1} 段。边界：${boundaries.join(" ")}`;
    }
    function applyCountyAiEqualCountBuckets(settings = {}) {
      const source = settings && typeof settings === "object" ? settings : {};
      const fallbackCount = clamp(Math.floor(Number(savedSettings.bucketCount) || 7), 2, 12);
      const bucketTotal = clamp(Math.floor(Number(source.bucketCount) || fallbackCount), 2, 12);
      const fillIndex = source.fillDataIndex !== undefined
        ? clamp(Math.floor(Number(source.fillDataIndex) + 1 || countyAiActiveDataIndex()), 1, RANK_DATA_COLUMN_COUNT)
        : source.excelDataColumn !== undefined
          ? clamp(Math.floor(Number(source.excelDataColumn) || countyAiActiveDataIndex()), 1, RANK_DATA_COLUMN_COUNT)
          : countyAiActiveDataIndex();
      const rows = countyAiRankRowsForDataIndex(fillIndex);
      const boundaries = countyEqualCountBoundariesFromRows(rows, bucketTotal);
      if (!boundaries.length) {
        throw new Error("当前没有足够的县级榜单数字数据用于等数量分段。");
      }
      const patch = {
        numericMode: "bucket",
        excelDataColumn: fillIndex,
        bucketCount: bucketTotal,
        boundaries
      };
      if (Array.isArray(source.bucketColors)) {
        patch.bucketColors = source.bucketColors;
      }
      const appliedMessage = applyCountyAiFillRuleSettings(patch);
      return `${appliedMessage}\n已按 ${rows.length} 个县级榜单数值生成 ${bucketTotal} 段等数量边界：${boundaries.join(" ")}`;
    }
    function installCountyMapProjectAiBridge() {
      window.mapProjectAiBridge = {
        getContext() {
          return {
            page: "province-county-map",
            province: PROVINCE.name,
            actions: ["updateFillRule", "equalCountBuckets", "topCountThenEqualBuckets", "updatePlaybackAnimation"],
            playbackAnimation: collectPlaybackAnimationSettings(),
            fillRule: {
              excelDataColumn: savedSettings.excelDataColumn,
              numericMode: savedSettings.numericMode,
              bucketCount: savedSettings.bucketCount,
              bucketBoundaries: savedSettings.bucketBoundaries,
              bucketColors: savedSettings.bucketColors,
              gradientLowColor: savedSettings.gradientLowColor,
              gradientHighColor: savedSettings.gradientHighColor,
              rulesText: savedSettings.rulesText,
              legendBarWidth: savedSettings.legendBarWidth,
              legendBarHeight: savedSettings.legendBarHeight,
              legendLabelFontSize: savedSettings.legendLabelFontSize
            },
            rankData: buildCountyAiRankDataContext(),
            schema: {
              excelDataColumn: "1-8, maps to data1-data8",
              numericMode: ["bucket", "gradient"],
              bucketCount: "2-12",
              bucketBoundaries: "space-separated numbers, e.g. 0 10 20 50",
              bucketColors: "array of #RRGGBB colors",
              gradientLowColor: "#RRGGBB",
              gradientHighColor: "#RRGGBB",
              rulesText: "one line per rule, e.g. >=80=#e76f51",
              legendBarWidth: "180-1200 px, color bar display width only",
              legendBarHeight: "8-80 px, color bar display height only",
              legendLabelFontSize: "8-48 px, numbers below the color bar only",
              equalCountBuckets: "uses current rankData to compute bucket boundaries with similar numbers of county regions",
              topCountThenEqualBuckets: "keeps top N county regions in the highest color bucket and splits the rest into other buckets",
              playbackAnimation: "safe playback animation settings; mode none/outline/pop/fly/fly-left/fly-right/fly-top/fly-bottom/flash/halo/draw/drop; duration 80-6000; scale 1-3; direction center/left/right/top/bottom/top-left/top-right/bottom-left/bottom-right; easing linear/ease-in/ease-out/ease-in-out/smooth; colorMode custom/fill; color #RRGGBB for custom color; fillOpacity 0-0.8; outlineWidth 1-12"
            }
          };
        },
        applyActions(actions = []) {
          const messages = [];
          actions.forEach((action) => {
            if (!action) return;
            if (action.type === "updateFillRule") {
              messages.push(applyCountyAiFillRuleSettings(action.settings || {}));
            } else if (action.type === "equalCountBuckets") {
              messages.push(applyCountyAiEqualCountBuckets(action.settings || {}));
            } else if (action.type === "topCountThenEqualBuckets") {
              messages.push(applyCountyAiTopCountThenEqualBuckets(action.settings || {}));
            } else if (action.type === "updatePlaybackAnimation") {
              messages.push(applyCountyAiPlaybackAnimationSettings(action.settings || {}));
            }
          });
          if (!messages.length) {
            throw new Error("没有可应用的填色规则动作。");
          }
          return { message: messages.join("\n") };
        }
      };
    }

    installCountyMapProjectAiBridge();

    [excelDataColumn, numericMode, bucketCount].forEach((control) => {
      control.addEventListener("change", () => {
        Object.assign(savedSettings, sanitizeSettings({
          ...savedSettings,
          excelDataColumn: Number(excelDataColumn.value),
          numericMode: numericMode.value,
          bucketCount: Number(bucketCount.value),
          rankSortColumn: control === excelDataColumn ? Number(excelDataColumn.value) : savedSettings.rankSortColumn
        }));
        if (control === excelDataColumn) {
          rankSortColumn.value = String(savedSettings.rankSortColumn);
        }
        writeJson(SETTINGS_KEY, savedSettings);
        syncRulePanelFromSettings();
        reapplyImportedDataColors();
        renderRankTable();
      });
    });

    rulesButton.addEventListener("click", () => {
      syncRulePanelFromSettings();
      rulesPanel.classList.remove("hidden");
    });

    rulesClose.addEventListener("click", () => rulesPanel.classList.add("hidden"));

    ruleBucketCount.addEventListener("change", () => {
      renderRuleBucketColors(collectRuleBucketColors());
    });

    document.getElementById("resetBucketColorsButton").addEventListener("click", () => {
      renderRuleBucketColors(DEFAULT_COLORS);
    });

    document.getElementById("saveRulesButton").addEventListener("click", () => {
      Object.assign(savedSettings, collectRulePanelSettings(true));
      writeJson(SETTINGS_KEY, savedSettings);
      applySettingsToTopControls();
      syncRulePanelFromSettings();
      reapplyImportedDataColors();
      renderLegendLabelEditor();
      updateStatus("已保存并应用县级地图填色规则。");
    });

    legendLabelButton.addEventListener("click", () => {
      renderLegendLabelEditor();
      legendLabelPanel.classList.remove("hidden");
    });

    legendLabelClose.addEventListener("click", () => legendLabelPanel.classList.add("hidden"));
    saveLegendLabelsButton.addEventListener("click", saveLegendLabelDisplay);
    resetLegendLabelsButton.addEventListener("click", () => {
      savedSettings.legendLabels = [];
      writeJson(SETTINGS_KEY, savedSettings);
      if (latestLegend.length && latestLegendDefaultLabels.length) {
        const markers = latestLegend[0].markers || [];
        markers.forEach((marker, index) => {
          marker.label = latestLegendDefaultLabels[index] ?? marker.label;
        });
        updateLegend(latestLegend);
      }
      applyLegendVisualSize();
      renderLegendLabelEditor();
      updateStatus("已恢复默认色条数字。");
    });

    toolbarClose.addEventListener("click", () => {
      topbar.classList.add("hidden");
      toolbarOpen.classList.remove("hidden");
    });

    toolbarOpen.addEventListener("click", () => {
      topbar.classList.remove("hidden");
      toolbarOpen.classList.add("hidden");
    });

    function adjustFineZoom(delta) {
      const nextZoom = Math.max(
        map.getMinZoom(),
        Math.min(map.getMaxZoom(), Number((map.getZoom() + delta).toFixed(2)))
      );
      map.setZoomAround(map.getCenter(), nextZoom, { animate: false });
    }

    document.querySelectorAll(".fine-zoom button[data-zoom-step]").forEach((button) => {
      ["pointerdown", "mousedown", "touchstart", "dblclick"].forEach((type) => {
        button.addEventListener(type, (event) => {
          event.stopPropagation();
        }, { passive: false });
      });
      button.addEventListener("click", (event) => {
        event.preventDefault();
        event.stopPropagation();
        const step = button.dataset.zoomStep;
        const delta = step === "in" ? 0.1 : step === "out" ? -0.1 : step === "fine-in" ? 0.01 : -0.01;
        adjustFineZoom(delta);
      });
    });

    reportButton.addEventListener("click", () => {
      renderReport();
      reportPanel.classList.remove("hidden");
    });

    document.getElementById("reportClose").addEventListener("click", () => reportPanel.classList.add("hidden"));

    rankButton.addEventListener("click", () => {
      const shouldShow = rankPanel.classList.contains("hidden");
      if (shouldShow) {
        applyRankSettingsToTable(false);
        renderRankTable(Number(playbackRange.value));
      }
      setRankPanelVisible(shouldShow);
    });

    rankClose.addEventListener("click", () => setRankPanelVisible(false));

    rankSettingsButton.addEventListener("click", () => {
      const shouldShow = rankSettingsPanel.classList.contains("hidden");
      if (shouldShow) {
        syncRankColumnTitleInputs(savedSettings.rankColumnTitles, savedSettings.rankColumnWidths);
      }
      setPanelVisible(rankSettingsPanel, rankSettingsButton, shouldShow);
    });

    rankSettingsClose.addEventListener("click", () => setPanelVisible(rankSettingsPanel, rankSettingsButton, false));

    animationSettingsButton.addEventListener("click", () => {
      const shouldShow = animationSettingsPanel.classList.contains("hidden");
      setPanelVisible(animationSettingsPanel, animationSettingsButton, shouldShow);
      if (shouldShow) {
        updatePlaybackAnimationFields();
        keepPanelReachable(animationSettingsPanel);
      }
    });

    animationSettingsClose.addEventListener("click", () => setPanelVisible(animationSettingsPanel, animationSettingsButton, false));

    [playbackAnimationMode, playbackAnimationDuration, playbackAnimationScale, playbackAnimationDirection, playbackAnimationEasing, playbackAnimationColorMode, playbackAnimationColor, playbackAnimationFillOpacity, playbackAnimationOutlineWidth].forEach((control) => {
      control?.addEventListener("input", () => setPlaybackAnimationSettings(collectPlaybackAnimationSettings(), true));
      control?.addEventListener("change", () => setPlaybackAnimationSettings(collectPlaybackAnimationSettings(), true));
    });

    savePlaybackAnimationSettingsButton.addEventListener("click", () => {
      setPlaybackAnimationSettings(collectPlaybackAnimationSettings(), true);
      updateStatus("已保存播放动画设置。");
    });

    resetPlaybackAnimationSettingsButton.addEventListener("click", () => {
      setPlaybackAnimationSettings(defaultPlaybackAnimationSettings(), true);
      updateStatus("已恢复默认播放动画设置。");
    });

    playbackButton.addEventListener("click", () => {
      const shouldShow = playbackPanel.classList.contains("hidden");
      if (shouldShow) {
        preparePlaybackRecords(null, { progressFromStoredColors: true });
      }
      setPanelVisible(playbackPanel, playbackButton, shouldShow);
    });

    playbackClose.addEventListener("click", () => setPanelVisible(playbackPanel, playbackButton, false));

    playbackRange.addEventListener("input", () => {
      stopPlayback();
      setPlaybackProgress(Number(playbackRange.value), { persist: true });
    });

    playButton.addEventListener("click", () => {
      if (playbackTimer || playbackStartTimer) {
        stopPlayback();
        saveColors();
        return;
      }
      startPlayback();
    });

    resetPlaybackButton.addEventListener("click", () => {
      stopPlayback();
      setPlaybackProgress(0, { persist: true });
    });

    playbackDirection.addEventListener("change", () => {
      const wasPlaying = Boolean(playbackTimer || playbackStartTimer);
      stopPlayback();
      rankSortDirection.value = playbackDirection.value;
      saveRankViewSettings();
      if (wasPlaying) startPlayback();
    });

    [rankSortColumn, rankSortDirection].forEach((control) => {
      control.addEventListener("input", saveRankViewSettings);
      control.addEventListener("change", saveRankViewSettings);
    });

    rankVisibleRows.addEventListener("change", () => applyRankSettingsToTable(true));

    rankColumnCount.addEventListener("input", () => {
      syncRankColumnTitleInputs();
      applyRankSettingsToTable(false);
    });

    rankColumnCount.addEventListener("change", () => applyRankSettingsToTable(true));
    rankColumnTitleFields.addEventListener("change", () => applyRankSettingsToTable(true));
    applyRankSettings.addEventListener("click", () => applyRankSettingsToTable(true));

    [playbackSpeed, playbackDelay].forEach((control) => {
      control.addEventListener("change", () => {
        saveSettings();
        if (playbackTimer || playbackStartTimer) {
          stopPlayback();
          startPlayback();
        }
      });
    });

    map.on("click", () => {
      selectedLayer = null;
      clearSelectedOutline();
      infoPanel.classList.add("hidden");
      refreshCountyStyles();
    });

    applySettingsToTopControls();
    syncRulePanelFromSettings();
    applyLegendVisualSize();
    renderLegendLabelEditor();
    syncReportButton();
    renderRankTable();
    floatingPanels().forEach(enablePanelDrag);
    window.addEventListener("resize", () => {
      floatingPanels().forEach(keepPanelReachable);
    });
    setFloatingPanelsLocked(false);
    setFloatingCloseButtonsHidden(floatingCloseButtonsHidden);
    buildPalette();
    initMap();
  </script>
  <script src="map_pages/ai_panel.js"></script>
</body>
</html>
