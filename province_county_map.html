<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>浙江省县级填色地图</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body,
    #map {
      width: 100%;
      height: 100%;
      margin: 0;
    }

    body {
      overflow: hidden;
      font-family: "Microsoft YaHei", "PingFang SC", "Segoe UI", sans-serif;
      color: #1c2a30;
      background: #eef4f4;
    }

    #map {
      background: #f8fbfb;
    }

    .topbar,
    .panel,
    .status,
    .toolbar-open {
      position: absolute;
      z-index: 900;
      border: 1px solid rgba(25, 58, 65, 0.14);
      background: rgba(255, 255, 255, 0.96);
      box-shadow: 0 14px 36px rgba(34, 57, 66, 0.16);
    }

    .topbar {
      top: 12px;
      left: 12px;
      right: 12px;
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      gap: 14px;
      border-radius: 10px;
      padding: 10px 12px;
    }

    .brand {
      display: grid;
      gap: 3px;
      min-width: 190px;
    }

    .brand h1 {
      margin: 0;
      font-size: 19px;
      line-height: 1.15;
    }

    .brand p {
      margin: 0;
      color: #64757c;
      font-size: 12px;
      line-height: 1.25;
      white-space: nowrap;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }

    .button,
    .field,
    .select,
    .number-input {
      height: 36px;
      border: 1px solid #cbd9de;
      border-radius: 8px;
      background: #fff;
      color: #25343b;
      font: inherit;
      font-size: 13px;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-weight: 700;
      padding: 0 12px;
    }

    .button.primary,
    .button.active {
      border-color: #2f7f83;
      background: #2f7f83;
      color: #fff;
    }

    .button.danger {
      border-color: #c58f80;
      color: #b1472f;
    }

    .panel-close {
      position: absolute;
      top: -12px;
      right: -12px;
      width: 28px;
      height: 28px;
      border: 1px solid #cbd8dc;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.96);
      color: #62767d;
      box-shadow: 0 8px 20px rgba(39, 58, 68, 0.16);
      cursor: pointer;
      font-size: 18px;
      font-weight: 900;
      line-height: 1;
      padding: 0;
    }

    .close-hidden .floating-close {
      display: none !important;
    }

    .draggable {
      cursor: grab;
    }

    .dragging {
      cursor: grabbing;
      user-select: none;
    }

    .field {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 0 8px;
      color: #53666e;
      white-space: nowrap;
    }

    .field input[type="color"] {
      width: 36px;
      height: 24px;
      border: 1px solid #9fb2b8;
      padding: 0;
      background: transparent;
    }

    .select,
    .number-input {
      padding: 0 9px;
    }

    .number-input {
      width: 82px;
    }

    .palette {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      height: 36px;
      border: 1px solid #cbd9de;
      border-radius: 8px;
      background: #fff;
      padding: 0 8px;
    }

    .swatch {
      width: 23px;
      height: 23px;
      border: 2px solid #fff;
      border-radius: 50%;
      box-shadow: 0 0 0 1px rgba(25, 46, 55, 0.28);
      cursor: pointer;
    }

    .swatch.active {
      box-shadow: 0 0 0 2px #2f7f83;
    }

    .toolbar-open {
      top: 12px;
      left: 12px;
      border-radius: 8px;
      padding: 0 12px;
    }

    .fine-zoom {
      position: absolute;
      z-index: 880;
      top: 72px;
      left: 14px;
      display: grid;
      grid-template-columns: 36px;
      gap: 4px;
      padding-top: 20px;
    }

    .fine-zoom.hidden {
      display: none;
    }

    .fine-zoom button {
      width: 36px;
      height: 32px;
      border: 1px solid #cbd8dc;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.94);
      color: #17202a;
      box-shadow: 0 8px 22px rgba(39, 58, 68, 0.12);
      cursor: pointer;
      font-size: 15px;
      font-weight: 700;
    }

    .fine-zoom button[data-zoom-step="fine-in"],
    .fine-zoom button[data-zoom-step="fine-out"] {
      font-size: 12px;
      font-weight: 600;
    }

    .fine-zoom button:hover {
      border-color: #78929a;
      background: #fff;
    }

    .fine-zoom .fine-zoom-close {
      position: absolute;
      top: -4px;
      right: -10px;
      width: 22px;
      height: 22px;
      padding: 0;
      border-radius: 50%;
      font-size: 16px;
      line-height: 18px;
      box-shadow: 0 6px 16px rgba(39, 58, 68, 0.16);
    }

    .panel {
      right: 14px;
      top: 88px;
      width: min(380px, calc(100vw - 28px));
      border-radius: 10px;
      padding: 14px;
    }

    .panel h2 {
      margin: 0 0 10px;
      font-size: 18px;
    }

    .info-grid {
      display: grid;
      grid-template-columns: 76px 1fr;
      gap: 8px 12px;
      font-size: 14px;
    }

    .info-grid .label {
      color: #65767c;
    }

    .info-grid .value {
      text-align: right;
      color: #25343b;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .status {
      left: 14px;
      bottom: 14px;
      display: grid;
      gap: 8px;
      width: min(470px, calc(100vw - 28px));
      border-radius: 10px;
      padding: 12px;
      color: #40545d;
      font-size: 13px;
    }

    .progress {
      height: 8px;
      overflow: hidden;
      border-radius: 999px;
      background: #dbe6e8;
    }

    .progress span {
      display: block;
      width: 0;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #2f7f83, #d87358);
      transition: width 0.18s ease;
    }

    .legend {
      --legend-bar-height: 22px;
      --legend-label-font-size: 13px;
      position: absolute;
      z-index: 880;
      right: 14px;
      bottom: 14px;
      width: min(500px, calc(100vw - 28px));
      padding: 0 28px 26px 0;
      pointer-events: auto;
    }

    .legend-bar {
      display: grid;
      height: var(--legend-bar-height);
      overflow: hidden;
      border: 1px solid #cbd8dc;
      border-radius: 5px;
      background: #eef4f4;
    }

    .legend-labels {
      position: relative;
      height: 28px;
      color: #2f4f95;
      font-size: var(--legend-label-font-size);
      font-weight: 800;
    }

    .legend-labels span {
      position: absolute;
      top: 3px;
      width: max-content;
      max-width: 86px;
      text-align: center;
      transform: translateX(-50%);
      white-space: nowrap;
    }

    .legend-labels span::before {
      position: absolute;
      top: calc(0px - var(--legend-bar-height) - 3px);
      left: 50%;
      width: 1px;
      height: var(--legend-bar-height);
      background: rgba(16, 35, 45, 0.45);
      content: "";
    }

    .legend-labels span:first-child {
      transform: translateX(0);
    }

    .legend-labels span:first-child::before {
      left: 0;
    }

    .legend-labels span:last-child {
      transform: translateX(-100%);
    }

    .legend-labels span:last-child::before {
      left: 100%;
    }

    .report {
      position: absolute;
      z-index: 930;
      left: 50%;
      top: 50%;
      width: min(760px, calc(100vw - 32px));
      max-height: min(680px, calc(100vh - 32px));
      overflow: auto;
      transform: translate(-50%, -50%);
      border: 1px solid rgba(25, 58, 65, 0.14);
      border-radius: 10px;
      background: #fff;
      box-shadow: 0 18px 46px rgba(34, 57, 66, 0.2);
      padding: 14px;
    }

    .report h2 {
      margin: 0 0 10px;
      font-size: 18px;
    }

    .playback-panel {
      position: absolute;
      z-index: 925;
      left: 50%;
      bottom: 16px;
      display: grid;
      width: min(760px, calc(100% - 28px));
      gap: 10px;
      padding: 12px 42px 14px 14px;
      transform: translateX(-50%);
      border: 1px solid rgba(25, 58, 65, 0.14);
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.97);
      box-shadow: 0 16px 42px rgba(34, 57, 66, 0.18);
      font-size: 13px;
    }

    .playback-panel.is-dragged {
      right: auto;
      bottom: auto;
      transform: none;
    }

    .playback-panel.dragging {
      user-select: none;
    }

    .playback-title {
      color: #17202a;
      cursor: move;
      font-weight: 700;
      user-select: none;
    }

    .playback-controls {
      display: grid;
      grid-template-columns: auto auto minmax(150px, 1fr) auto auto auto auto;
      gap: 8px;
      align-items: center;
    }

    .playback-controls input[type="range"] {
      width: 100%;
      accent-color: #2f7f83;
    }

    .playback-count {
      color: #53666e;
      white-space: nowrap;
    }

    .playback-speed {
      width: 94px;
      height: 34px;
      border: 1px solid #cbd8dc;
      border-radius: 7px;
      background: #fff;
      color: #25333a;
      font: inherit;
      padding: 0 8px;
    }

    .playback-direction {
      width: 92px;
    }


    .animation-settings-panel {
      position: absolute;
      z-index: 930;
      right: 24px;
      bottom: 116px;
      display: grid;
      width: min(420px, calc(100vw - 28px));
      gap: 12px;
      padding: 14px 42px 16px 14px;
      border: 1px solid #dbe5e8;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.96);
      box-shadow: 0 16px 46px rgba(32, 52, 62, 0.14);
      backdrop-filter: blur(8px);
      font-size: 13px;
    }

    .animation-settings-title {
      color: #17202a;
      cursor: move;
      font-weight: 800;
      user-select: none;
    }

    .animation-settings-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .animation-settings-field {
      display: grid;
      gap: 5px;
      color: #52636c;
      font-weight: 700;
    }

    .animation-settings-field input,
    .animation-settings-field select {
      width: 100%;
      height: 34px;
      border: 1px solid #cbd8dc;
      border-radius: 7px;
      background: #fff;
      color: #25333a;
      font: inherit;
      padding: 0 8px;
    }

    .animation-settings-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: flex-end;
    }

    .playback-animation-path {
      pointer-events: none;
      transform-box: fill-box;
      transform-origin: center;
      vector-effect: non-scaling-stroke;
      animation-duration: var(--playback-anim-duration, 650ms);
      animation-timing-function: var(--playback-anim-easing, ease-out);
      animation-fill-mode: both;
      will-change: transform, opacity, filter;
    }

    .playback-animation-outline {
      animation-name: playbackOutlinePulse;
    }

    .playback-animation-pop {
      animation-name: playbackPopIn;
    }

    .playback-animation-fly {
      animation-name: playbackFlyIn;
    }

    .playback-animation-fly-left,
    .playback-animation-fly-right,
    .playback-animation-fly-top,
    .playback-animation-fly-bottom {
      animation-name: playbackStageFlyIn;
    }

    .playback-animation-flash {
      animation-name: playbackColorFlash;
    }

    .playback-animation-halo {
      animation-name: playbackHaloPulse;
      filter: drop-shadow(0 0 8px var(--playback-anim-color, #e07b51));
    }

    .playback-animation-draw {
      animation-name: playbackDrawOutline;
      stroke-dasharray: var(--playback-anim-dash, 260);
      stroke-dashoffset: var(--playback-anim-dash, 260);
    }

    .playback-animation-drop {
      animation-name: playbackDropLand;
    }

    @keyframes playbackOutlinePulse {
      0% { opacity: 0; stroke-dashoffset: 34; }
      22% { opacity: 1; stroke-dashoffset: 0; }
      72% { opacity: 0.9; }
      100% { opacity: 0; }
    }

    @keyframes playbackPopIn {
      0% { opacity: 0; transform: scale(0.35); }
      62% { opacity: 1; transform: scale(var(--playback-anim-scale, 1.18)); }
      100% { opacity: 0; transform: scale(1); }
    }

    @keyframes playbackFlyIn {
      0% { opacity: 0; transform: translate(var(--playback-anim-x, 0px), var(--playback-anim-y, 0px)) scale(var(--playback-anim-scale, 1.18)); }
      72% { opacity: 1; transform: translate(0, 0) scale(1); }
      100% { opacity: 0; transform: translate(0, 0) scale(1); }
    }

    @keyframes playbackStageFlyIn {
      0% {
        opacity: 0;
        transform: translate(var(--playback-anim-stage-x, 0px), var(--playback-anim-stage-y, 0px)) scale(var(--playback-anim-scale, 1.18));
        filter: saturate(1.2) brightness(1.08);
      }
      66% {
        opacity: 1;
        transform: translate(0, 0) scale(1);
        filter: saturate(1.25) brightness(1.05);
      }
      82% {
        opacity: 1;
        transform: translate(var(--playback-anim-bounce-x, 0px), var(--playback-anim-bounce-y, 0px)) scale(1.025);
      }
      100% {
        opacity: 0;
        transform: translate(0, 0) scale(1);
        filter: saturate(1);
      }
    }

    @keyframes playbackColorFlash {
      0% { opacity: 0; filter: saturate(1); }
      30% { opacity: 1; filter: saturate(1.7) brightness(1.08); }
      100% { opacity: 0; filter: saturate(1); }
    }

    @keyframes playbackHaloPulse {
      0% { opacity: 0; transform: scale(0.92); filter: drop-shadow(0 0 0 var(--playback-anim-color, #e07b51)); }
      38% { opacity: 1; transform: scale(var(--playback-anim-scale, 1.18)); filter: drop-shadow(0 0 14px var(--playback-anim-color, #e07b51)); }
      72% { opacity: 0.95; transform: scale(1.03); filter: drop-shadow(0 0 8px var(--playback-anim-color, #e07b51)); }
      100% { opacity: 0; transform: scale(1); filter: drop-shadow(0 0 0 var(--playback-anim-color, #e07b51)); }
    }

    @keyframes playbackDrawOutline {
      0% { opacity: 0; stroke-dashoffset: var(--playback-anim-dash, 260); }
      18% { opacity: 1; }
      74% { opacity: 1; stroke-dashoffset: 0; }
      100% { opacity: 0; stroke-dashoffset: 0; }
    }

    @keyframes playbackDropLand {
      0% {
        opacity: 0;
        transform: translate(var(--playback-anim-x, 0px), var(--playback-anim-y, -180px)) scale(0.72);
        filter: brightness(1.12);
      }
      58% { opacity: 1; transform: translate(0, 0) scale(var(--playback-anim-scale, 1.18)); }
      76% { opacity: 1; transform: translate(0, -8px) scale(0.98); }
      100% { opacity: 0; transform: translate(0, 0) scale(1); filter: brightness(1); }
    }
    .rank-header-note {
      display: none;
      padding: 7px 8px;
      border: 1px solid #dbe5e8;
      border-radius: 7px;
      background: #f8fbfb;
      color: #40515a;
      font-size: 12px;
      font-weight: 700;
    }

    .rank-header-note.visible {
      display: block;
    }

    .rank-panel {
      position: absolute;
      z-index: 925;
      top: 86px;
      right: 14px;
      display: grid;
      width: fit-content;
      max-width: calc(100vw - 28px);
      min-width: 260px;
      gap: 0;
      padding: 0;
      border: 0;
      background: transparent;
      box-shadow: none;
      backdrop-filter: none;
      font-size: 13px;
      --rank-row-odd: #d8f0e3;
      --rank-row-even: #f7fcf9;
      --rank-grid-color: #6aa183;
    }

    .rank-panel .panel-close {
      top: -13px;
      right: -13px;
      box-shadow: 0 3px 10px rgba(36, 54, 64, 0.16);
    }

    .rank-panel .rank-header-note.visible {
      margin-bottom: 8px;
    }

    .rank-panel.is-dragged {
      right: auto;
      bottom: auto;
      transform: none;
    }

    .rank-panel.dragging {
      user-select: none;
    }

    .rank-table {
      border: 1px solid var(--rank-grid-color);
      border-collapse: separate;
      border-spacing: 0;
      overflow: hidden;
      border-radius: 8px;
      font-size: 12px;
      table-layout: fixed;
    }

    .rank-table thead {
      cursor: move;
      user-select: none;
    }

    .rank-table th,
    .rank-table td {
      border-right: 1px solid rgba(53, 119, 84, 0.45);
      border-bottom: 1px solid rgba(53, 119, 84, 0.45);
      max-width: 0;
      padding: 7px 8px;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .rank-table th {
      background: #1f6b46;
      color: #fff;
    }

    .rank-table th:last-child,
    .rank-table td:last-child {
      border-right: 0;
    }

    .rank-table tr:last-child td {
      border-bottom: 0;
    }

    .rank-table tbody tr:nth-child(odd) td {
      background: var(--rank-row-odd);
    }

    .rank-table tbody tr:nth-child(even) td {
      background: var(--rank-row-even);
    }

    .rank-empty {
      padding: 8px 10px;
      border: 1px solid rgba(24, 46, 56, 0.12);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.8);
      color: #687982;
      font-size: 12px;
    }

    .rank-settings-panel {
      position: absolute;
      z-index: 925;
      right: 16px;
      top: 100px;
      width: min(760px, calc(100vw - 32px));
      max-height: min(760px, calc(100vh - 120px));
      overflow: auto;
      border: 1px solid rgba(25, 58, 65, 0.14);
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.97);
      box-shadow: 0 16px 42px rgba(34, 57, 66, 0.18);
      padding: 14px;
    }

    .rank-settings-title {
      margin-bottom: 10px;
      color: #17202a;
      font-size: 18px;
      font-weight: 900;
    }

    .rank-settings-grid,
    .rank-column-title-fields {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px 12px;
    }

    .rank-settings-section-title {
      margin: 14px 0 8px;
      color: #52636c;
      font-size: 13px;
      font-weight: 800;
    }

    .rank-settings-field {
      display: grid;
      gap: 5px;
      color: #52636c;
      font-size: 13px;
      font-weight: 700;
    }

    .rank-settings-field input,
    .rank-settings-field select {
      width: 100%;
      height: 36px;
      border: 1px solid #cbd8dc;
      border-radius: 7px;
      background: #fff;
      color: #25333a;
      font: inherit;
      padding: 0 9px;
    }

    .rank-settings-actions {
      display: flex;
      justify-content: flex-end;
      margin-top: 12px;
    }

    .settings-panel {
      position: absolute;
      z-index: 925;
      left: 18px;
      top: 88px;
      width: min(430px, calc(100vw - 36px));
      max-height: min(760px, calc(100vh - 120px));
      overflow: auto;
      border: 1px solid rgba(25, 58, 65, 0.14);
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.97);
      box-shadow: 0 16px 42px rgba(34, 57, 66, 0.18);
      padding: 14px;
    }

    .settings-panel h2 {
      margin: 0 0 10px;
      font-size: 18px;
    }

    .settings-grid {
      display: grid;
      gap: 10px;
    }

    .settings-grid.two {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .settings-field {
      display: grid;
      gap: 5px;
      color: #52636c;
      font-size: 13px;
      font-weight: 700;
    }

    .settings-field input,
    .settings-field select,
    .settings-field textarea {
      width: 100%;
      border: 1px solid #cbd8dc;
      border-radius: 7px;
      background: #fff;
      color: #25333a;
      font: inherit;
    }

    .settings-field input,
    .settings-field select {
      height: 36px;
      padding: 0 9px;
    }

    .settings-field textarea {
      min-height: 110px;
      padding: 8px 9px;
      resize: vertical;
      line-height: 1.45;
    }

    .color-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(135px, 1fr));
      gap: 8px;
    }

    .color-row {
      display: grid;
      grid-template-columns: auto 1fr;
      align-items: center;
      gap: 8px;
      border: 1px solid #d5e1e5;
      border-radius: 7px;
      background: #f9fbfb;
      padding: 7px;
      color: #52636c;
      font-size: 13px;
      font-weight: 700;
    }

    .color-row input[type="color"] {
      width: 100%;
      height: 28px;
      padding: 0;
    }

    .setting-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 10px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    th,
    td {
      border-bottom: 1px solid #dce7e9;
      padding: 7px 8px;
      text-align: left;
    }

    th {
      background: #eff5f5;
      font-weight: 800;
    }

    .hidden,
    .hidden-file {
      display: none !important;

    function normalizePlaybackAnimationMode(value) {
      return ["none", "outline", "pop", "fly", "fly-left", "fly-right", "fly-top", "fly-bottom", "flash", "halo", "draw", "drop"].includes(value) ? value : "none";
    }

    function normalizePlaybackAnimationDirection(value) {
      return ["center", "left", "right", "top", "bottom", "top-left", "top-right", "bottom-left", "bottom-right"].includes(value) ? value : "center";
    }

    function normalizePlaybackAnimationEasing(value) {
      return ["linear", "ease", "ease-in", "ease-out", "ease-in-out", "smooth"].includes(value) ? value : "ease-out";
    }

    function normalizePlaybackAnimationColorMode(value) {
      return value === "fill" ? "fill" : "custom";
    }

    function boundedNumber(value, min, max, fallback) {
      const numeric = Number(value);
      if (!Number.isFinite(numeric)) return fallback;
      return Math.max(min, Math.min(max, numeric));
    }

    function sanitizePlaybackAnimationSettings(source = {}, fallback = defaultPlaybackAnimationSettings()) {
      const settings = source && typeof source === "object" ? source : {};
      return {
        playbackAnimationMode: normalizePlaybackAnimationMode(settings.playbackAnimationMode ?? settings.mode ?? settings.animationMode ?? fallback.playbackAnimationMode),
        playbackAnimationDuration: Math.round(boundedNumber(settings.playbackAnimationDuration ?? settings.duration ?? settings.animationDuration, 80, 6000, fallback.playbackAnimationDuration)),
        playbackAnimationScale: Number(boundedNumber(settings.playbackAnimationScale ?? settings.scale ?? settings.animationScale, 1, 3, fallback.playbackAnimationScale).toFixed(2)),
        playbackAnimationDirection: normalizePlaybackAnimationDirection(settings.playbackAnimationDirection ?? settings.direction ?? settings.animationDirection ?? fallback.playbackAnimationDirection),
        playbackAnimationEasing: normalizePlaybackAnimationEasing(settings.playbackAnimationEasing ?? settings.easing ?? settings.animationEasing ?? fallback.playbackAnimationEasing),
        playbackAnimationColorMode: normalizePlaybackAnimationColorMode(settings.playbackAnimationColorMode ?? settings.colorMode ?? settings.animationColorMode ?? fallback.playbackAnimationColorMode),
        playbackAnimationColor: isHexColor(settings.playbackAnimationColor ?? settings.color ?? settings.highlightColor ?? settings.animationColor) ? String(settings.playbackAnimationColor ?? settings.color ?? settings.highlightColor ?? settings.animationColor).toLowerCase() : fallback.playbackAnimationColor,
        playbackAnimationFillOpacity: Number(boundedNumber(settings.playbackAnimationFillOpacity ?? settings.fillOpacity ?? settings.animationFillOpacity, 0, 0.8, fallback.playbackAnimationFillOpacity).toFixed(2)),
        playbackAnimationOutlineWidth: Number(boundedNumber(settings.playbackAnimationOutlineWidth ?? settings.outlineWidth ?? settings.animationOutlineWidth, 1, 12, fallback.playbackAnimationOutlineWidth).toFixed(1))
      };
    }

    function sanitizeSettings(value = {}) {
      const source = value && typeof value === "object" ? value : {};
      const fallback = defaultSettings();
      const rawLegendBarWidth = Number(source.legendBarWidth ?? source.bucketLegendBarWidth);
      const rawLegendBarHeight = Number(source.legendBarHeight ?? source.bucketLegendBarHeight);
      const oldDefaultLegendSize = rawLegendBarWidth === 420 && rawLegendBarHeight === 30;
      const bucketCountValue = clamp(Math.floor(Number(source.bucketCount) || fallback.bucketCount), 2, 12);
      const bucketColors = Array.from({ length: bucketCountValue }, (_, index) => {
        const color = Array.isArray(source.bucketColors) ? source.bucketColors[index] : "";
        return isHexColor(color) ? String(color).toLowerCase() : DEFAULT_COLORS[index % DEFAULT_COLORS.length];
      });
      return {
        excelDataColumn: clamp(Math.floor(Number(source.excelDataColumn) || fallback.excelDataColumn), 1, RANK_DATA_COLUMN_COUNT),
        importNameColumn: normalizeExcelColumnLetter(source.importNameColumn, fallback.importNameColumn),
        importData1Column: normalizeExcelColumnLetter(source.importData1Column, fallback.importData1Column),
        importData2Column: normalizeExcelColumnLetter(source.importData2Column, fallback.importData2Column),
        importData3Column: normalizeExcelColumnLetter(source.importData3Column, fallback.importData3Column),
        importData4Column: normalizeExcelColumnLetter(source.importData4Column, fallback.importData4Column),
        importData5Column: normalizeExcelColumnLetter(source.importData5Column, fallback.importData5Column),
        importData6Column: normalizeExcelColumnLetter(source.importData6Column, fallback.importData6Column),
        importData7Column: normalizeExcelColumnLetter(source.importData7Column, fallback.importData7Column),
        importData8Column: normalizeExcelColumnLetter(source.importData8Column, fallback.importData8Column),
        numericMode: source.numericMode === "gradient" ? "gradient" : "bucket",
        bucketCount: bucketCountValue,
        bucketBoundaries: String(source.bucketBoundaries ?? fallback.bucketBoundaries),
        bucketColors,
        gradientLowColor: isHexColor(source.gradientLowColor) ? String(source.gradientLowColor).toLowerCase() : fallback.gradientLowColor,
        gradientHighColor: isHexColor(source.gradientHighColor) ? String(source.gradientHighColor).toLowerCase() : fallback.gradientHighColor,
        rulesText: String(source.rulesText ?? fallback.rulesText),
        legendLabels: Array.isArray(source.legendLabels) ? source.legendLabels.map((label) => String(label ?? "")) : [],
        legendBarWidth: oldDefaultLegendSize ? 500 : clamp(Math.floor(Number(source.legendBarWidth ?? source.bucketLegendBarWidth) || fallback.legendBarWidth), 180, 1200),
        legendBarHeight: oldDefaultLegendSize ? 22 : clamp(Math.floor(Number(source.legendBarHeight ?? source.bucketLegendBarHeight) || fallback.legendBarHeight), 8, 80),
        legendLabelFontSize: clamp(Math.floor(Number(source.legendLabelFontSize ?? source.bucketLegendLabelFontSize) || fallback.legendLabelFontSize), 8, 48),
        rankSortColumn: clamp(Math.floor(Number(source.rankSortColumn) || source.excelDataColumn || fallback.rankSortColumn), 1, RANK_DATA_COLUMN_COUNT),
        rankSortDirection: source.rankSortDirection === "desc" ? "desc" : (source.rankSortDirection === "asc" ? "asc" : fallback.rankSortDirection),
        rankVisibleRows: clamp(Math.floor(Number(source.rankVisibleRows) || fallback.rankVisibleRows), 1, 100),
        rankColumnCount: clamp(Math.floor(Number(source.rankColumnCount) || fallback.rankColumnCount), 1, RANK_COLUMNS.length),
        rankColumnTitles: RANK_COLUMNS.map((column, index) => {
          const title = Array.isArray(source.rankColumnTitles) ? String(source.rankColumnTitles[index] ?? "").trim() : "";
          if (index === 1 && normalizeText(title) === "所属") {
            return column.label;
          }
          return title || column.label;
        }),
        rankColumnWidths: RANK_COLUMN_WIDTHS.map((width, index) => {
          const value = Array.isArray(source.rankColumnWidths) ? Number(source.rankColumnWidths[index]) : NaN;
          return Number.isFinite(value) && value > 0 ? value : width;
        }),
        playbackSpeed: clamp(Math.floor(Number(source.playbackSpeed) || fallback.playbackSpeed), 1, 600000),
        playbackDelay: clamp(Math.floor(Number(source.playbackDelay) || fallback.playbackDelay), 0, 600000),
        ...sanitizePlaybackAnimationSettings(source, fallback)
      };
    }

    function migrateLegacyProvinceStorage() {
      if (PROVINCE.adcode !== "330000") return;
      const legacyPrefix = CURRENT_PROJECT_ID === "default"
        ? "province-county-map-zhejiang-v1"
        : `province-county-map-zhejiang-v1:${CURRENT_PROJECT_ID}`;
      if (legacyPrefix === STORAGE_PREFIX) return;
      ["colors", "data", "settings", "hide-close-buttons"].forEach((suffix) => {
        const nextKey = `${STORAGE_PREFIX}:${suffix}`;
        const legacyKey = `${legacyPrefix}:${suffix}`;
        if (localStorage.getItem(nextKey) === null && localStorage.getItem(legacyKey) !== null) {
          localStorage.setItem(nextKey, localStorage.getItem(legacyKey));
        }
      });
    }

    function asAdcode(value) {
      return String(value || "").padStart(6, "0");
    }

    function isHexColor(value) {
      return /^#[0-9a-f]{6}$/i.test(String(value || ""));
    }

    function clamp(value, min, max) {
      return Math.max(min, Math.min(max, value));
    }

    function boundaryUrl(adcode, full = true) {
      return `${DATA_BASE}/${adcode}${full ? "_full" : ""}.json`;
    }

    async function fetchGeoJson(adcode, full = true) {
      const response = await fetch(boundaryUrl(adcode, full), { cache: "force-cache" });
      if (!response.ok) {
        throw new Error(`${adcode} 边界加载失败`);
      }
      return response.json();
    }

    function getFeatureName(feature) {
      return String(feature?.properties?.name || "");
    }

    function getFeatureCode(feature) {
      return asAdcode(feature?.properties?.adcode);
    }

    function getParentName(feature) {
      return String(feature?.properties?.parent?.name || PROVINCE.name);
    }

    function shouldLoadChildCounties(feature) {
      if (PROVINCE.directCounty) return false;
      const code = getFeatureCode(feature);
      return /^\d{4}00$/.test(code);
    }

    function normalizeName(value) {
      return String(value || "")
        .trim()
        .replace(/\s+/g, "")
        .replace(/^(浙江省|浙江)/, "")
        .replace(/(特别行政区|自治县|自治州|自治旗|市辖区)$/g, "")
        .replace(/[县市区]$/g, "");
    }

    function normalizeText(value) {
      return String(value || "")
        .trim()
        .replace(/\s+/g, "")
        .toLowerCase();
    }

    function normalizeExcelColumnLetter(value, fallback = "A") {
      const text = String(value || "")
        .trim()
        .toUpperCase()
        .replace(/[^A-Z]/g, "");
      return text || fallback;
    }

    function excelColumnIndex(value, fallback) {
      const letters = normalizeExcelColumnLetter(value, fallback);
      let index = 0;
      for (const char of letters) {
        index = index * 26 + (char.charCodeAt(0) - 64);
      }
      return Math.max(0, index - 1);
    }

    function getImportColumnIndexes(source = savedSettings) {
      const result = {
        name: excelColumnIndex(source.importNameColumn, "A")
      };
      DATA_KEYS.forEach((key, index) => {
        result[key] = excelColumnIndex(source[`importData${index + 1}Column`], DEFAULT_IMPORT_DATA_COLUMNS[index]);
      });
      return result;
    }

    function cellByIndex(row, index) {
      return index >= 0 ? String(row?.[index] ?? "").trim() : "";
    }

    function isAuxiliaryImportHeader(value) {
      const text = normalizeText(value);
      return /^(所属|所属地市|所属城市|所属市|地市|地级市|上级|父级|省份|省|城市|市|排名|名次|序号|代码|adcode)$/.test(text);
    }

    function importColumnsFromHeader(header, configuredColumns) {
      const used = new Set([configuredColumns.name]);
      const preferred = DATA_KEYS.map((key) => configuredColumns[key]);
      const dataIndexes = [];
      preferred.forEach((index) => {
        if (index >= 0 && !used.has(index) && !dataIndexes.includes(index) && !isAuxiliaryImportHeader(header?.[index])) {
          dataIndexes.push(index);
        }
      });
      for (let index = 0; index < (header?.length || 0) && dataIndexes.length < RANK_DATA_COLUMN_COUNT; index += 1) {
        if (used.has(index) || dataIndexes.includes(index)) continue;
        if (!String(header?.[index] ?? "").trim()) continue;
        if (isAuxiliaryImportHeader(header[index])) continue;
        dataIndexes.push(index);
      }
      while (dataIndexes.length < RANK_DATA_COLUMN_COUNT) {
        dataIndexes.push(-1);
      }
      return {
        name: configuredColumns.name,
        ...Object.fromEntries(DATA_KEYS.map((key, index) => [key, dataIndexes[index]]))
      };
    }

    function shortParentRankName(value) {
      return String(value || "")
        .trim()
        .replace(/自治州$/, "")
        .replace(/地区$/, "")
        .replace(/盟$/, "")
        .replace(/市$/, "");
    }

    function addCountyAlias(name, code) {
      const normalized = normalizeName(name);
      if (!normalized) return;
      if (!countyByName.has(normalized)) {
        countyByName.set(normalized, code);
      }
    }

    function buildCountyIndexes(feature, parentName) {
      const code = getFeatureCode(feature);
      const name = getFeatureName(feature);
      countyMetaByCode.set(code, {
        code,
        name,
        parentName,
        rawName: name
      });
      addCountyAlias(name, code);
      addCountyAlias(name.replace(/(市|区|县)$/g, ""), code);
      addCountyAlias(`${parentName}${name}`, code);
    }

    function matchCounty(value) {
      const text = String(value || "").trim();
      if (!text) return null;
      const code = text.match(/\d{6}/)?.[0];
      if (code && countyLayerByCode.has(code)) return code;
      const normalized = normalizeName(text);
      if (countyByName.has(normalized)) return countyByName.get(normalized);
      for (const [name, adcode] of countyByName.entries()) {
        if (name && (normalized.includes(name) || name.includes(normalized))) {
          return adcode;
        }
      }
      return null;
    }

    function countyStyle(feature) {
      const code = getFeatureCode(feature);
      const fillColor = colors[code] || "#eef6f5";
      const selected = selectedLayer?.feature && getFeatureCode(selectedLayer.feature) === code;
      return {
        color: selected ? "#d87358" : "#69a9b0",
        weight: selected ? 2.4 : 0.8,
        opacity: 1,
        fillColor,
        fillOpacity: colors[code] ? 0.86 : 0.42
      };
    }

    function countyHighlightStyle(feature) {
      const style = countyStyle(feature);
      return {
        ...style,
        color: "#f28a55",
        weight: 3,
        opacity: 1
      };
    }

    function cityStyle() {
      return {
        color: "#31515b",
        weight: 1.7,
        opacity: 0.92,
        fillOpacity: 0,
        interactive: false
      };
    }

    function provinceStyle() {
      return {
        color: "#243940",
        weight: 2.4,
        opacity: 0.98,
        fillOpacity: 0,
        interactive: false
      };
    }

    function refreshCountyStyles() {
      countyLayerByCode.forEach((layer) => layer.setStyle(countyStyle(layer.feature)));
    }

    function clearSelectedOutline() {
      if (selectedOutlineLayer) {
        selectedOutlineLayer.remove();
        selectedOutlineLayer = null;
      }
    }

    function showSelectedOutline(feature) {
      clearSelectedOutline();
      selectedOutlineLayer = L.geoJSON(feature, {
        style: {
          color: "#f28a55",
          weight: 3,
          opacity: 1,
          fillOpacity: 0,

    function collectPlaybackAnimationSettings() {
      return sanitizePlaybackAnimationSettings({
        playbackAnimationMode: playbackAnimationMode?.value,

        playbackAnimationScale: playbackAnimationScale?.value,
        playbackAnimationDirection: playbackAnimationDirection?.value,

    function updatePlaybackAnimationFields() {
      if (!animationSettingsPanel || !playbackAnimationMode) return;
      const mode = playbackAnimationMode.value;
      animationSettingsPanel.querySelectorAll("[data-animation-extra]").forEach((field) => {
        field.hidden = mode === "none";

    function setPlaybackAnimationSettings(settings, persist = false) {
      const safeSettings = sanitizePlaybackAnimationSettings(settings, savedSettings);
      if (playbackAnimationMode) playbackAnimationMode.value = safeSettings.playbackAnimationMode;
      if (playbackAnimationDuration) playbackAnimationDuration.value = String(safeSettings.playbackAnimationDuration);
      if (playbackAnimationScale) playbackAnimationScale.value = String(safeSettings.playbackAnimationScale);
      if (playbackAnimationDirection) playbackAnimationDirection.value = safeSettings.playbackAnimationDirection;
      if (playbackAnimationEasing) playbackAnimationEasing.value = safeSettings.playbackAnimationEasing;
      if (playbackAnimationColorMode) playbackAnimationColorMode.value = safeSettings.playbackAnimationColorMode;
      if (playbackAnimationColor) playbackAnimationColor.value = safeSettings.playbackAnimationColor;
      if (playbackAnimationFillOpacity) playbackAnimationFillOpacity.value = String(safeSettings.playbackAnimationFillOpacity);
      if (playbackAnimationOutlineWidth) playbackAnimationOutlineWidth.value = String(safeSettings.playbackAnimationOutlineWidth);
      Object.assign(savedSettings, safeSettings);
      updatePlaybackAnimationFields();
      if (persist) saveSettings();

    function playbackAnimationCssEasing(value) {
      if (value === "smooth") return "cubic-bezier(.22,.8,.25,1)";
      if (["linear", "ease", "ease-in", "ease-out", "ease-in-out"].includes(value)) return value;
      return "ease-out";
    }

    function playbackAnimationOffset(direction) {
      const offsets = {
        center: [0, 0],
        left: [-180, 0],
        right: [180, 0],
        top: [0, -150],
        bottom: [0, 150],
        "top-left": [-160, -125],
        "top-right": [160, -125],
        "bottom-left": [-160, 125],
        "bottom-right": [160, 125]
      };
      return offsets[direction] || offsets.center;
    }

    function playbackAnimationStageOffset(mode, layer, direction) {
      const stageModeSide = {
        "fly-left": "left",
        "fly-right": "right",
        "fly-top": "top",
        "fly-bottom": "bottom"
      };
      const side = stageModeSide[mode];
      if (!side) return playbackAnimationOffset(direction);
      const size = map.getSize();
      const bounds = layer?.getBounds?.();
      const center = bounds?.isValid?.()
        ? map.latLngToContainerPoint(bounds.getCenter())
        : L.point(size.x / 2, size.y / 2);
      const margin = Math.max(180, Math.min(size.x, size.y) * 0.16);
      if (side === "left") return [-(center.x + margin), 0];
      if (side === "right") return [size.x - center.x + margin, 0];
      if (side === "top") return [0, -(center.y + margin)];
      return [0, size.y - center.y + margin];
    }

    function playbackAnimationBounceOffset(offsetX, offsetY) {
      const bounce = 12;
      return [
        offsetX ? -Math.sign(offsetX) * bounce : 0,
        offsetY ? -Math.sign(offsetY) * bounce : 0
      ];
    }

    function playbackAnimationDashArray(mode) {
      if (mode === "outline") return "7 5";
      if (mode === "draw") return "260 260";
      return null;
    }

    function playbackAnimationFillColor(mode, recordColor, animationColor) {
      return ["outline", "draw", "halo"].includes(mode) ? animationColor : (recordColor || animationColor);
    }

    function playbackAnimationEffectiveColor(settings, recordColor) {
      const fillColor = String(recordColor || "").toLowerCase();
      return settings.playbackAnimationColorMode === "fill" && isHexColor(fillColor) ? fillColor : settings.playbackAnimationColor;
    }

    function playbackAnimationModeFillOpacity(mode, configuredOpacity) {
      if (mode === "outline" || mode === "draw") return Math.min(0.16, configuredOpacity);
      if (mode === "halo") return Math.min(0.2, configuredOpacity);
      return configuredOpacity;
    }

    function ensurePlaybackAnimationRenderer() {
      if (!map.getPane("playbackAnimationPane")) {
        const pane = map.createPane("playbackAnimationPane");
        pane.style.zIndex = 690;
        pane.style.pointerEvents = "none";
      }
      if (!playbackAnimationRenderer) {
        playbackAnimationRenderer = L.svg({ pane: "playbackAnimationPane" }).addTo(map);
      }
      return playbackAnimationRenderer;

    function clearPlaybackAnimationLayer() {
      if (playbackAnimationLayer) {

    function animatePlaybackRecord(record) {
      const settings = collectPlaybackAnimationSettings();
      if (settings.playbackAnimationMode === "none" || !record) {
        clearPlaybackAnimationLayer();
        return;
      }
      const layer = countyLayerByCode.get(asAdcode(record.code));
      if (!layer?.feature) return;
      clearPlaybackAnimationLayer();
      const [offsetX, offsetY] = playbackAnimationStageOffset(settings.playbackAnimationMode, layer, settings.playbackAnimationDirection);
      const [bounceX, bounceY] = playbackAnimationBounceOffset(offsetX, offsetY);
      const animationColor = playbackAnimationEffectiveColor(settings, record.fillColor);
      const animationLayer = L.geoJSON(layer.feature, {
        interactive: false,
        pane: "playbackAnimationPane",
        renderer: ensurePlaybackAnimationRenderer(),
        style: {
          className: `playback-animation-path playback-animation-${settings.playbackAnimationMode}`,
          color: animationColor,
          weight: settings.playbackAnimationOutlineWidth,
          opacity: 0.98,
          dashArray: playbackAnimationDashArray(settings.playbackAnimationMode),
          fillColor: playbackAnimationFillColor(settings.playbackAnimationMode, record.fillColor, animationColor),
          fillOpacity: playbackAnimationModeFillOpacity(settings.playbackAnimationMode, settings.playbackAnimationFillOpacity)
        }
      }).addTo(map);
      playbackAnimationLayer = animationLayer;
      animationLayer.eachLayer((item) => {
        if (!item._path) return;
        item._path.style.setProperty("--playback-anim-duration", `${settings.playbackAnimationDuration}ms`);
        item._path.style.setProperty("--playback-anim-scale", String(settings.playbackAnimationScale));
        item._path.style.setProperty("--playback-anim-x", `${offsetX}px`);
        item._path.style.setProperty("--playback-anim-y", `${offsetY}px`);
        item._path.style.setProperty("--playback-anim-stage-x", `${offsetX}px`);
        item._path.style.setProperty("--playback-anim-stage-y", `${offsetY}px`);
        item._path.style.setProperty("--playback-anim-bounce-x", `${bounceX}px`);
        item._path.style.setProperty("--playback-anim-bounce-y", `${bounceY}px`);
        item._path.style.setProperty("--playback-anim-color", animationColor);
        item._path.style.setProperty("--playback-anim-dash", "260");
        item._path.style.setProperty("--playback-anim-easing", playbackAnimationCssEasing(settings.playbackAnimationEasing));
      });
      window.setTimeout(() => {
        if (playbackAnimationLayer === animationLayer) {
          clearPlaybackAnimationLayer();
        }
      }, settings.playbackAnimationDuration + 120);
    }

    function panelLimits(element) {
      const rect = element.getBoundingClientRect();
      return {
        minX: -rect.width / 2,
        maxX: window.innerWidth - rect.width / 2,
        minY: -rect.height / 2,
        maxY: window.innerHeight - rect.height / 2
      };
    }

    function pinPanelAtCurrentPosition(element) {
      const rect = element.getBoundingClientRect();
      element.style.left = `${rect.left}px`;
      element.style.top = `${rect.top}px`;
      element.style.right = "auto";
      element.style.bottom = "auto";
      element.style.width = `${rect.width}px`;
      element.style.transform = "none";
    }

    function keepPanelReachable(element) {
      if (!element || element.classList.contains("hidden")) return;
      const rect = element.getBoundingClientRect();
      const limits = panelLimits(element);
      const nextLeft = clamp(rect.left, limits.minX, limits.maxX);
      const nextTop = clamp(rect.top, limits.minY, limits.maxY);
      if (Math.abs(nextLeft - rect.left) > 0.5 || Math.abs(nextTop - rect.top) > 0.5) {
        pinPanelAtCurrentPosition(element);
        element.style.left = `${nextLeft}px`;
        element.style.top = `${nextTop}px`;
      }
    }

    function enablePanelDrag(element) {
      if (!element) return;
      const allowInteractiveDrag = element === fineZoom;
      let suppressClick = false;
      element.classList.add("draggable");
      element.addEventListener("click", (event) => {
        if (suppressClick) {
          event.preventDefault();
          event.stopImmediatePropagation();
          suppressClick = false;
          return;
        }
        event.stopPropagation();
      }, true);
      ["dblclick", "wheel"].forEach((type) => {
        element.addEventListener(type, (event) => event.stopPropagation());
      });
      element.addEventListener("pointerdown", (event) => {
        event.stopPropagation();
        if (floatingPanelsLocked || event.button !== 0 || (!allowInteractiveDrag && isInteractiveTarget(event.target))) return;
        const rect = element.getBoundingClientRect();
        pinPanelAtCurrentPosition(element);
        const startX = event.clientX;
        const startY = event.clientY;
        const startLeft = rect.left;
        const startTop = rect.top;
        let moved = false;
        element.classList.add("dragging");
        element.setPointerCapture?.(event.pointerId);
        if (!allowInteractiveDrag) {
          event.preventDefault();
        }

        function onMove(moveEvent) {
          const deltaX = moveEvent.clientX - startX;
          const deltaY = moveEvent.clientY - startY;
          if (Math.abs(deltaX) + Math.abs(deltaY) > 4) {
            moved = true;
            moveEvent.preventDefault();
          }
          const limits = panelLimits(element);
          const nextLeft = clamp(startLeft + deltaX, limits.minX, limits.maxX);
          const nextTop = clamp(startTop + deltaY, limits.minY, limits.maxY);
          element.style.left = `${nextLeft}px`;
          element.style.top = `${nextTop}px`;
        }

        function onEnd() {
          element.classList.remove("dragging");
          element.removeEventListener("pointermove", onMove);
          element.removeEventListener("pointerup", onEnd);
          element.removeEventListener("pointercancel", onEnd);
          suppressClick = moved;
          if (suppressClick) {
            window.setTimeout(() => {
              suppressClick = false;
            }, 0);
          }
        }

        element.addEventListener("pointermove", onMove);
        element.addEventListener("pointerup", onEnd);
        element.addEventListener("pointercancel", onEnd);
      });
    }
